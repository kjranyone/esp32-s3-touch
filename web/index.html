<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ESP32-S3 · Hardware Workbench</title>
  <style>
    :root {
      --fg: rgba(235, 242, 255, 0.88);
      --muted: rgba(176, 192, 218, 0.58);
      --accent: #70e2f4;
      --green: #4ef09a;
      --glass: rgba(15, 19, 28, 0.56);
      --glass-border: rgba(255, 255, 255, 0.11);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #14171d;
      color: var(--fg);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Top-left interactive board/cartridge & rig pill */
    .corner-tl {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      z-index: 16;
    }

    .cart-trigger {
      appearance: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--fg);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .cart-trigger:hover,
    .cart-trigger.open {
      border-color: rgba(112, 226, 244, 0.45);
      color: #fff;
    }

    .cart-sep { color: rgba(255, 255, 255, 0.25); }
    .cart-caret { font-size: 9px; color: var(--muted); margin-left: 1px; }

    .dot-live {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(78, 240, 154, 0.8);
      flex-shrink: 0;
    }

    .cart-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: min(312px, calc(100vw - 32px));
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      padding: 8px;
      border-radius: 14px;
      background: rgba(10, 13, 20, 0.90);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65);
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .cart-menu.open { display: flex; }

    .menu-sec-lbl {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.14em;
      color: var(--muted);
      padding: 4px 6px 1px;
      text-transform: uppercase;
    }

    .menu-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 2px 4px;
    }

    .cart-item {
      appearance: none;
      width: 100%;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--fg);
      padding: 7px 9px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-family: var(--mono);
      font-size: 11px;
      white-space: nowrap;
      transition: background 0.12s, color 0.12s;
    }

    .cart-item:hover { background: rgba(255, 255, 255, 0.07); }
    .cart-item.active { background: rgba(112, 226, 244, 0.16); color: var(--accent); }

    .cart-tag {
      font-size: 9.5px;
      color: var(--muted);
      white-space: nowrap;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 2px 4px;
    }

    .chip-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      padding: 5px 8px;
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
    }

    .chip-btn:hover { color: #fff; border-color: rgba(255, 255, 255, 0.28); }
    .chip-btn.active {
      color: #0b1018;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }
    .chip-btn.on-green {
      color: #081610;
      background: var(--green);
      border-color: var(--green);
      font-weight: 700;
    }

    .action-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding: 2px 4px 2px;
    }

    .action-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--fg);
      font-family: var(--mono);
      font-size: 10px;
      padding: 6px 4px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.12s, color 0.12s;
    }

    .action-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Drop-to-Flash Overlay */
    .drop-veil {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: none;
      place-items: center;
      background: rgba(8, 12, 20, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .drop-veil.show { display: grid; }
    .drop-box {
      padding: 22px 28px;
      border-radius: 16px;
      border: 1.5px dashed var(--accent);
      background: rgba(14, 20, 32, 0.85);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-align: center;
    }

    .corner-tr {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 15;
    }

    .icon-link {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: color 0.15s, border-color 0.15s;
    }

    .icon-link:hover { color: #fff; border-color: rgba(112, 226, 244, 0.4); }

    /* Bottom chrome: floating pill + credit */
    .bottom-chrome {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    .dock {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      max-width: calc(100vw - 24px);
    }

    .pill-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .pill-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.07); }
    .pill-btn.active { color: #0b1018; background: var(--accent); }

    .pill-sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }

    /* Minimal hidden serial popover */
    .serial-pop {
      position: fixed;
      left: 50%;
      bottom: calc(max(18px, env(safe-area-inset-bottom)) + 52px);
      transform: translateX(-50%);
      width: min(380px, calc(100vw - 28px));
      padding: 10px;
      border-radius: 14px;
      background: rgba(10, 13, 20, 0.86);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 12;
    }

    .serial-pop.open { display: flex; }

    .serial-out {
      height: 124px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.45;
      color: #a9e9f8;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
    }

    .serial-row { display: flex; gap: 6px; }

    .serial-in {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 6px 10px;
      color: #fff;
      font-family: var(--mono);
      font-size: 11px;
      outline: none;
    }

    .serial-in:focus { border-color: var(--accent); }

    /* Minimal credit */
    .credit {
      position: absolute;
      right: max(18px, env(safe-area-inset-right));
      top: 50%;
      transform: translateY(-50%);
      pointer-events: auto;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.04em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .credit a {
      color: rgba(220, 234, 255, 0.72);
      text-decoration: none;
      transition: color 0.15s;
    }

    .credit a:hover { color: var(--accent); }

    @media (max-width: 1140px) {
      .bottom-chrome {
        flex-direction: column;
        gap: 8px;
        bottom: max(12px, env(safe-area-inset-bottom));
        padding: 0 max(10px, env(safe-area-inset-left)) 0 max(10px, env(safe-area-inset-right));
      }
      .credit {
        position: static;
        top: auto;
        right: auto;
        transform: none;
        flex-wrap: wrap;
        justify-content: center;
        font-size: 10px;
        gap: 6px;
        line-height: 1.35;
        text-align: center;
      }
      .serial-pop { bottom: calc(max(12px, env(safe-area-inset-bottom)) + 80px); }
    }

    @media (max-width: 540px) {
      .cart-trigger { font-size: 10px; padding: 5px 9px; gap: 6px; }
      .icon-link { font-size: 10px; padding: 5px 9px; }
      .bottom-chrome { gap: 7px; bottom: max(10px, env(safe-area-inset-bottom)); }
      .dock {
        gap: 2px;
        padding: 4px;
        max-width: calc(100vw - 16px);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .dock::-webkit-scrollbar { display: none; }
      .pill-btn { font-size: 10px; letter-spacing: 0.04em; padding: 6px 8px; }
      .pill-sep { height: 14px; margin: 0 1px; }
      .credit { font-size: 9.5px; gap: 5px; }
      .serial-pop { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 74px); }
    }

    @media (max-height: 500px) {
      .bottom-chrome { gap: 4px; bottom: max(8px, env(safe-area-inset-bottom)); }
      .pill-btn { padding: 5px 9px; }
      .credit { font-size: 9.5px; }
    }

    /* Boot veil & cinematic intro chrome reveal */
    .veil {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #080a0f;
      z-index: 30;
      transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .veil.gone { opacity: 0; pointer-events: none; }

    body.intro-playing .bottom-chrome,
    body.intro-playing .corner-tl,
    body.intro-playing .corner-tr {
      opacity: 0;
      pointer-events: none;
    }

    body.intro-playing .dock,
    body.intro-playing .credit {
      pointer-events: none;
    }

    .bottom-chrome, .corner-tl, .corner-tr { transition: opacity 0.55s ease; }

    .pulse {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(112, 226, 244, 0.22);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="viewport"></div>

  <div class="corner-tl">
    <button class="cart-trigger" id="cart-trigger" type="button" aria-haspopup="dialog" aria-expanded="false">
      <span class="dot-live"></span>
      <span>ESP32-S3</span>
      <span class="cart-sep">·</span>
      <span id="cart-label">Crystal Garden</span>
      <span class="cart-caret">▾</span>
    </button>
    <div class="cart-menu" id="cart-menu" role="dialog" aria-label="Workbench Rig"></div>
    <input id="flash-file-in" type="file" multiple accept=".js,.wasm,.json" style="display:none" />
  </div>

  <div class="corner-tr">
    <a class="icon-link" href="https://github.com/kjranyone/esp32-s3-touch" target="_blank" rel="noopener">GitHub ↗</a>
  </div>

  <div class="serial-pop" id="serial-pop">
    <div class="serial-out" id="serial-out"></div>
    <form class="serial-row" id="serial-form">
      <input class="serial-in" id="serial-in" type="text" autocomplete="off" spellcheck="false" placeholder="UART 115200" />
      <button class="pill-btn active" type="submit">TX</button>
    </form>
  </div>

  <div class="bottom-chrome">
    <nav class="dock" aria-label="View controls">
      <button class="pill-btn active" data-view="iso">3D</button>
      <button class="pill-btn" data-view="front">FRONT</button>
      <button class="pill-btn" data-view="pcb">PCB</button>
      <span class="pill-sep"></span>
      <button class="pill-btn" id="btn-speed">1x</button>
      <button class="pill-btn active" id="btn-sfx" title="Sound Effects">SFX</button>
      <button class="pill-btn active" id="btn-ir" title="IR Spatial Acoustics (STUDIO / HALL / DRY)">IR</button>
      <button class="pill-btn" id="btn-uart" title="UART">&gt;_</button>
    </nav>

    <footer class="credit">
      <span>Created by Kojiro Tanaka</span>
      <span>·</span>
      <a href="https://x.com/mu_sette" target="_blank" rel="noopener">@mu_sette</a>
      <span>·</span>
      <a href="https://oto-nari.com" target="_blank" rel="noopener">oto-nari.com</a>
    </footer>
  </div>

  <div class="drop-veil" id="drop-veil">
    <div class="drop-box">DROP .JS + .WASM TO FLASH<br/>OR .JSON RIG MANIFEST</div>
  </div>

  <div class="veil" id="veil"><div class="pulse"></div></div>

  <script type="module">
    import { Workbench } from './sim/Workbench.js';
    import './sim/Esp32WorkbenchElement.js';

    const urlParams = new URLSearchParams(window.location.search);
    const startView = urlParams.get('view');
    const skipIntro = Boolean(startView) || urlParams.get('intro') === '0'
      || urlParams.has('board') || urlParams.has('periph');
    const initialRig = Workbench.parseRigFromParams(urlParams);

    const serialPop = document.getElementById('serial-pop');
    const serialOut = document.getElementById('serial-out');
    const serialForm = document.getElementById('serial-form');
    const serialIn = document.getElementById('serial-in');
    const btnUart = document.getElementById('btn-uart');
    const btnSpeed = document.getElementById('btn-speed');
    const btnSfx = document.getElementById('btn-sfx');
    const btnIr = document.getElementById('btn-ir');
    const cartTrigger = document.getElementById('cart-trigger');
    const cartLabel = document.getElementById('cart-label');
    const cartMenu = document.getElementById('cart-menu');
    const flashFileIn = document.getElementById('flash-file-in');
    const dropVeil = document.getElementById('drop-veil');

    let logLines = [];
    let logBuf = '';
    window.onEmulatorSerial = (chunk) => {
      logBuf += chunk;
      const parts = logBuf.split('\n');
      logBuf = parts.pop();
      for (const p of parts) logLines.push(p.replace(/\r/g, ''));
      if (logLines.length > 160) logLines = logLines.slice(-160);
      serialOut.textContent = logLines.join('\n') + (logBuf ? '\n' + logBuf : '');
      serialOut.scrollTop = serialOut.scrollHeight;
    };

    const wb = new Workbench(document.getElementById('viewport'), {
      onViewChange(name) {
        document.querySelectorAll('[data-view]').forEach((b) => {
          b.classList.toggle('active', b.dataset.view === name);
        });
      },
      onCartridgeLoaded(cart) {
        cartLabel.textContent = cart.name;
        serialIn.placeholder = cart.uartPlaceholder || 'UART 115200';
        document.title = `ESP32-S3 · ${cart.name}`;
        renderRigMenu();
      },
      onRigChange() {
        renderRigMenu();
      },
      onSfxSync() {
        const muted = wb.host.audioIsMuted() || !wb.bus.isI2sAudioRouted();
        btnSfx.classList.toggle('active', !muted);
        btnSfx.textContent = !wb.bus.isI2sAudioRouted() ? 'RLY' : (muted ? 'MUTE' : 'SFX');
      },
      onJumperChange() {
        const muted = wb.host.audioIsMuted() || !wb.bus.isI2sAudioRouted();
        btnSfx.classList.toggle('active', !muted);
        btnSfx.textContent = !wb.bus.isI2sAudioRouted() ? 'RLY' : (muted ? 'MUTE' : 'SFX');
        renderRigMenu();
      },
    });

    function closeMenu() {
      cartMenu.classList.remove('open');
      cartTrigger.classList.remove('open');
      cartTrigger.setAttribute('aria-expanded', 'false');
    }

    function renderRigMenu() {
      const cfg = wb.getRigConfig();
      cartMenu.innerHTML = '';

      /* 1. Firmware Cartridges */
      const l1 = document.createElement('div');
      l1.className = 'menu-sec-lbl';
      l1.textContent = 'Firmware Cartridges';
      cartMenu.appendChild(l1);

      for (const p of Workbench.presets) {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'cart-item' + (wb.currentCartridge?.id === p.id ? ' active' : '');
        item.innerHTML = `<span>${p.name}</span><span class="cart-tag">${p.tag}</span>`;
        item.addEventListener('click', async () => {
          closeMenu();
          window.onEmulatorSerial(`\n[workbench] Loading cartridge: ${p.name}...\n`);
          await wb.loadCartridge(p.id);
        });
        cartMenu.appendChild(item);
      }

      /* 2. Hardware Board */
      const d1 = document.createElement('div'); d1.className = 'menu-divider'; cartMenu.appendChild(d1);
      const l2 = document.createElement('div'); l2.className = 'menu-sec-lbl'; l2.textContent = 'Board'; cartMenu.appendChild(l2);
      const bRow = document.createElement('div'); bRow.className = 'chip-row';
      for (const b of Workbench.boards) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip-btn' + (cfg.board === b.id ? ' active' : '');
        btn.textContent = b.name;
        btn.addEventListener('click', () => wb.setBoard(b.id));
        bRow.appendChild(btn);
      }
      cartMenu.appendChild(bRow);

      /* 3. Modular Peripherals & Jumper */
      const d2 = document.createElement('div'); d2.className = 'menu-divider'; cartMenu.appendChild(d2);
      const l3 = document.createElement('div'); l3.className = 'menu-sec-lbl'; l3.textContent = 'Peripherals & Bus'; cartMenu.appendChild(l3);
      const pRow = document.createElement('div'); pRow.className = 'chip-row';
      for (const per of Workbench.peripheralCatalog) {
        const on = cfg.peripherals.includes(per.id);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip-btn' + (on ? ' on-green' : '');
        btn.textContent = (on ? '✓ ' : '+ ') + per.name;
        btn.addEventListener('click', () => wb.togglePeripheral(per.id));
        pRow.appendChild(btn);
      }
      const jBtn = document.createElement('button');
      jBtn.type = 'button';
      const isRly = (cfg.jumpers[0] || 0) !== 0;
      jBtn.className = 'chip-btn' + (isRly ? ' active' : '');
      jBtn.textContent = isRly ? 'R25-27: RLY' : 'R21-23: I2S';
      jBtn.title = 'Toggle physical 0-ohm jumper between NS4168 I2S and 3ch Relay J3';
      jBtn.addEventListener('click', () => wb.toggleJumper(0));
      pRow.appendChild(jBtn);
      cartMenu.appendChild(pRow);

      /* 4. Portable Sandbox Actions */
      const d3 = document.createElement('div'); d3.className = 'menu-divider'; cartMenu.appendChild(d3);
      const aRow = document.createElement('div'); aRow.className = 'action-row';

      const btnFlash = document.createElement('button');
      btnFlash.type = 'button'; btnFlash.className = 'action-btn'; btnFlash.textContent = 'Flash WASM';
      btnFlash.addEventListener('click', () => { closeMenu(); flashFileIn.click(); });

      const btnShare = document.createElement('button');
      btnShare.type = 'button'; btnShare.className = 'action-btn'; btnShare.textContent = 'Share URL';
      btnShare.addEventListener('click', async () => {
        const url = wb.buildShareUrl();
        try { await navigator.clipboard.writeText(url); btnShare.textContent = 'Copied!'; }
        catch (_) { window.prompt('Share Workbench URL:', url); }
        setTimeout(() => { btnShare.textContent = 'Share URL'; }, 1400);
      });

      const btnJson = document.createElement('button');
      btnJson.type = 'button'; btnJson.className = 'action-btn'; btnJson.textContent = 'Export JSON';
      btnJson.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(wb.getRigConfig(), null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `esp32-rig-${cfg.cartridge}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      });

      aRow.append(btnFlash, btnShare, btnJson);
      cartMenu.appendChild(aRow);
    }

    async function handleDroppedFiles(fileList) {
      const files = Array.from(fileList || []);
      const jsonFile = files.find((f) => f.name.endsWith('.json'));
      if (jsonFile) {
        try {
          const cfg = JSON.parse(await jsonFile.text());
          await wb.applyRigConfig(cfg);
          window.onEmulatorSerial(`\n[rig] Loaded manifest: ${jsonFile.name}\n`);
        } catch (err) {
          window.onEmulatorSerial(`\n[rig] Invalid JSON manifest: ${err.message}\n`);
        }
        return;
      }
      const jsFile = files.find((f) => f.name.endsWith('.js'));
      const wasmFile = files.find((f) => f.name.endsWith('.wasm'));
      if (jsFile && wasmFile) {
        try {
          await wb.flashLocalFiles(jsFile, wasmFile);
        } catch (err) {
          window.onEmulatorSerial(`\n[flash] Error: ${err.message}\n`);
        }
      } else {
        window.onEmulatorSerial('\n[flash] Please drop both .js and .wasm files together (or a .json rig).\n');
      }
    }

    flashFileIn.addEventListener('change', (e) => {
      if (e.target.files?.length) handleDroppedFiles(e.target.files);
      flashFileIn.value = '';
    });

    let dragDepth = 0;
    window.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; dropVeil.classList.add('show'); });
    window.addEventListener('dragover', (e) => { e.preventDefault(); });
    window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) dropVeil.classList.remove('show'); });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragDepth = 0;
      dropVeil.classList.remove('show');
      if (e.dataTransfer?.files?.length) handleDroppedFiles(e.dataTransfer.files);
    });

    cartTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = cartMenu.classList.toggle('open');
      cartTrigger.classList.toggle('open', open);
      cartTrigger.setAttribute('aria-expanded', String(open));
    });

    cartMenu.addEventListener('click', (e) => e.stopPropagation());
    window.addEventListener('click', closeMenu);

    document.querySelectorAll('[data-view]').forEach((btn) => {
      btn.addEventListener('click', () => wb.setView(btn.dataset.view));
    });

    btnUart.addEventListener('click', () => {
      const open = serialPop.classList.toggle('open');
      btnUart.classList.toggle('active', open);
      if (open) serialIn.focus();
    });

    serialForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const v = serialIn.value.trim();
      if (!v) return;
      wb.sendUart(v);
      serialIn.value = '';
    });

    btnSpeed.addEventListener('click', () => {
      const m = wb.toggleSpeed();
      btnSpeed.textContent = m + 'x';
      btnSpeed.classList.toggle('active', m === 2);
    });

    btnSfx.addEventListener('click', () => wb.toggleMute());

    btnIr.addEventListener('click', () => {
      const mode = wb.cycleIrMode();
      btnIr.classList.toggle('active', mode !== 'dry');
      btnIr.textContent = mode === 'studio' ? 'IR' : (mode === 'hall' ? 'HALL' : 'DRY');
    });

    wb.applyRigConfig(initialRig, {
      initCmd: urlParams.get('cmd'),
      skipFrames: Number(urlParams.get('f') || 0),
    }).then(() => {
      const veil = document.getElementById('veil');
      const pulseEl = veil.querySelector('.pulse');
      if (pulseEl) pulseEl.style.display = 'none';

      wb.start({ startView, skipIntro });

      requestAnimationFrame(() => {
        veil.classList.add('gone');
        setTimeout(() => veil.remove(), skipIntro ? 400 : 950);
      });
    });
  </script>
</body>
</html>
