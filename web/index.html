<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ESP32-S3 · Crystal Garden</title>
  <style>
    :root {
      --fg: rgba(235, 242, 255, 0.88);
      --muted: rgba(176, 192, 218, 0.58);
      --accent: #70e2f4;
      --glass: rgba(15, 19, 28, 0.56);
      --glass-border: rgba(255, 255, 255, 0.11);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #14171d;
      color: var(--fg);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Minimal corner stamp */
    .corner-tl {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      left: max(20px, env(safe-area-inset-left));
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .dot-live {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ef09a;
      box-shadow: 0 0 8px rgba(78, 240, 154, 0.8);
    }

    .corner-tr {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-link {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: color 0.15s, border-color 0.15s;
    }

    .icon-link:hover {
      color: #fff;
      border-color: rgba(112, 226, 244, 0.4);
    }

    /* Bottom floating pill */
    .dock {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    .pill-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .pill-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.07); }
    .pill-btn.active { color: #0b1018; background: var(--accent); }

    .pill-sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }

    /* Minimal hidden serial popover */
    .serial-pop {
      position: fixed;
      left: 50%;
      bottom: calc(max(18px, env(safe-area-inset-bottom)) + 52px);
      transform: translateX(-50%);
      width: min(380px, calc(100vw - 28px));
      padding: 10px;
      border-radius: 14px;
      background: rgba(10, 13, 20, 0.86);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 12;
    }

    .serial-pop.open { display: flex; }

    .serial-out {
      height: 124px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.45;
      color: #a9e9f8;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
    }

    .serial-row {
      display: flex;
      gap: 6px;
    }

    .serial-in {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 6px 10px;
      color: #fff;
      font-family: var(--mono);
      font-size: 11px;
      outline: none;
    }

    .serial-in:focus { border-color: var(--accent); }

    /* Minimal credit */
    .credit {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.04em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 5;
    }

    .credit a {
      color: rgba(220, 234, 255, 0.72);
      text-decoration: none;
      transition: color 0.15s;
    }

    .credit a:hover { color: var(--accent); }

    @media (max-width: 960px) {
      .credit {
        left: 50%;
        right: auto;
        bottom: max(68px, calc(env(safe-area-inset-bottom) + 64px));
        transform: translateX(-50%);
        white-space: nowrap;
        font-size: 10px;
      }
      .serial-pop {
        bottom: calc(max(18px, env(safe-area-inset-bottom)) + 88px);
      }
    }

    /* Boot veil */
    .veil {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #14171d;
      z-index: 30;
      transition: opacity 0.35s ease;
    }

    .veil.gone {
      opacity: 0;
      pointer-events: none;
    }

    .pulse {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(112, 226, 244, 0.22);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="viewport"></div>

  <div class="corner-tl">
    <span class="dot-live"></span>
    <span>ESP32-S3</span>
  </div>

  <div class="corner-tr">
    <a class="icon-link" href="https://github.com/kjranyone/esp32-s3-touch" target="_blank" rel="noopener">GitHub ↗</a>
  </div>

  <div class="serial-pop" id="serial-pop">
    <div class="serial-out" id="serial-out"></div>
    <form class="serial-row" id="serial-form">
      <input class="serial-in" id="serial-in" type="text" autocomplete="off" spellcheck="false" placeholder="UART 115200 (boss / ult / box / wave 50 / ?)" />
      <button class="pill-btn active" type="submit">TX</button>
    </form>
  </div>

  <nav class="dock" aria-label="View controls">
    <button class="pill-btn active" data-view="iso">3D</button>
    <button class="pill-btn" data-view="front">FRONT</button>
    <button class="pill-btn" data-view="pcb">PCB</button>
    <span class="pill-sep"></span>
    <button class="pill-btn" id="btn-speed">1x</button>
    <button class="pill-btn active" id="btn-sfx" title="Sound Effects">SFX</button>
    <button class="pill-btn active" id="btn-ir" title="IR Spatial Acoustics (STUDIO / HALL / DRY)">IR</button>
    <button class="pill-btn" id="btn-uart" title="UART">&gt;_</button>
  </nav>

  <footer class="credit">
    <span>Created by Kojiro Tanaka</span>
    <span>·</span>
    <a href="https://x.com/mu_sette" target="_blank" rel="noopener">@mu_sette</a>
    <span>·</span>
    <a href="https://oto-nari.com" target="_blank" rel="noopener">oto-nari.com</a>
  </footer>

  <div class="veil" id="veil"><div class="pulse"></div></div>

  <script src="crystal_garden.js"></script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    /* ============================================================
     * 1. Offscreen 480x480 LCD Surface (WASM Framebuffer Target)
     * ============================================================ */
    const lcdCanvas = document.createElement('canvas');
    lcdCanvas.width = 480;
    lcdCanvas.height = 480;
    const lcdCtx = lcdCanvas.getContext('2d', { alpha: false });
    lcdCtx.fillStyle = '#070a12';
    lcdCtx.fillRect(0, 0, 480, 480);

    const lcdTexture = new THREE.CanvasTexture(lcdCanvas);
    lcdTexture.colorSpace = THREE.SRGBColorSpace;
    lcdTexture.minFilter = THREE.LinearFilter;
    lcdTexture.magFilter = THREE.NearestFilter;
    lcdTexture.generateMipmaps = false;

    /* ============================================================
     * 2. Procedural Textures (Cutting Mat & ESP32-S3 Back PCB)
     * ============================================================ */
    function makeCuttingMatTexture() {
      const c = document.createElement('canvas');
      c.width = 2048;
      c.height = 2048;
      const g = c.getContext('2d');

      g.fillStyle = '#252930';
      g.fillRect(0, 0, 2048, 2048);

      // Subtle matte grain
      g.fillStyle = 'rgba(255,255,255,0.014)';
      for (let i = 0; i < 14000; i++) {
        g.fillRect((Math.random() * 2048) | 0, (Math.random() * 2048) | 0, 2, 2);
      }

      const step = 64; // 10mm grid
      // Fine 10mm grid
      g.strokeStyle = 'rgba(220, 230, 242, 0.14)';
      g.lineWidth = 1.5;
      g.beginPath();
      for (let x = 0; x <= 2048; x += step) {
        g.moveTo(x, 0); g.lineTo(x, 2048);
        g.moveTo(0, x); g.lineTo(2048, x);
      }
      g.stroke();

      // Major 50mm grid
      g.strokeStyle = 'rgba(235, 242, 250, 0.28)';
      g.lineWidth = 2.4;
      g.beginPath();
      for (let x = 0; x <= 2048; x += step * 5) {
        g.moveTo(x, 0); g.lineTo(x, 2048);
        g.moveTo(0, x); g.lineTo(2048, x);
      }
      g.stroke();

      // Diagonal angle guide lines (like real cutting mat)
      g.strokeStyle = 'rgba(220, 230, 242, 0.12)';
      g.lineWidth = 1.5;
      g.beginPath();
      g.moveTo(0, 2048); g.lineTo(2048, 0);
      g.moveTo(0, 1024); g.lineTo(1024, 0);
      g.moveTo(1024, 2048); g.lineTo(2048, 1024);
      g.stroke();

      // Center cross ticks
      g.fillStyle = 'rgba(225, 235, 245, 0.24)';
      g.font = '600 18px ui-monospace, monospace';
      for (let i = 1; i <= 6; i++) {
        g.fillText(String(i * 5), i * step * 5 + 6, 2048 - 14);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      tex.anisotropy = 8;
      return tex;
    }

    function makePcbTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1024;
      const g = c.getContext('2d');

      // Matte black solder mask
      g.fillStyle = '#12161b';
      g.fillRect(0, 0, 1024, 1024);

      // Subtle dark-green/slate copper traces
      g.strokeStyle = '#1d272e';
      g.lineWidth = 5;
      for (let i = 0; i < 24; i++) {
        const y = 170 + i * 26;
        g.beginPath();
        g.moveTo(90, y);
        g.lineTo(280 + (i % 5) * 18, y);
        g.lineTo(340 + (i % 5) * 18, y + 36);
        g.lineTo(660, y + 36);
        g.stroke();
      }
      for (let i = 0; i < 16; i++) {
        const x = 140 + i * 44;
        g.beginPath();
        g.moveTo(x, 120);
        g.lineTo(x, 420);
        g.lineTo(x + 28, 448);
        g.lineTo(x + 28, 860);
        g.stroke();
      }

      // Gold ENIG vias
      for (let i = 0; i < 65; i++) {
        const vx = 90 + ((i * 137) % 840);
        const vy = 90 + ((i * 223) % 840);
        g.fillStyle = '#c9a24b';
        g.beginPath(); g.arc(vx, vy, 5.5, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#090b0e';
        g.beginPath(); g.arc(vx, vy, 2.3, 0, Math.PI * 2); g.fill();
      }

      // Silkscreen frame & markings
      g.strokeStyle = 'rgba(235, 240, 248, 0.58)';
      g.lineWidth = 3;
      g.strokeRect(42, 42, 940, 940);

      g.fillStyle = 'rgba(235, 240, 248, 0.85)';
      g.font = '700 28px ui-monospace, monospace';
      g.fillText('ESP32-4848S040C_I_Y_3', 84, 118);

      g.fillStyle = 'rgba(210, 224, 240, 0.62)';
      g.font = '600 18px ui-monospace, monospace';
      g.fillText('ESP32-S3R8 · 16MB FLASH · 8MB OPI PSRAM', 84, 152);
      g.fillText('ST7701 RGB565 480x480 · GT911 I2C', 84, 180);

      // Component labels
      g.font = '700 16px ui-monospace, monospace';
      g.fillStyle = 'rgba(225, 232, 240, 0.72)';
      g.fillText('U1  ESP32-S3-WROOM-1', 515, 212);
      g.fillText('U2  CH340C', 110, 560);
      g.fillText('TF_CARD', 115, 280);
      g.fillText('SPK', 120, 745);
      g.fillText('USB-C 5V', 435, 922);
      g.fillText('BOOT', 760, 882);
      g.fillText('RST', 845, 882);
      g.fillText('RELAY / IO', 640, 760);

      // Gold test pads row
      for (let i = 0; i < 10; i++) {
        const px = 135 + i * 32;
        g.fillStyle = '#d4af52';
        g.fillRect(px, 845, 16, 26);
      }
      g.fillStyle = 'rgba(225, 232, 240, 0.6)';
      g.font = '600 13px ui-monospace, monospace';
      g.fillText('3V3 GND TX RX IO1 IO2 IO40 SCL SDA EN', 130, 892);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function makeEspShieldTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const g = c.getContext('2d');

      // Brushed stainless steel
      const grad = g.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#c8cfd8');
      grad.addColorStop(0.5, '#aeb6c2');
      grad.addColorStop(1, '#98a1ae');
      g.fillStyle = grad;
      g.fillRect(0, 0, 512, 512);

      g.strokeStyle = 'rgba(255,255,255,0.08)';
      g.lineWidth = 2;
      for (let y = 0; y < 512; y += 6) {
        g.beginPath(); g.moveTo(0, y); g.lineTo(512, y); g.stroke();
      }

      // Laser etched Espressif-style branding
      g.fillStyle = '#383e48';
      g.beginPath();
      g.arc(96, 118, 34, 0, Math.PI * 2);
      g.strokeStyle = '#383e48';
      g.lineWidth = 7;
      g.stroke();
      g.font = '700 26px ui-monospace, monospace';
      g.fillText('Wi-Fi', 152, 112);
      g.font = '600 20px ui-monospace, monospace';
      g.fillText('BLE 5.0', 152, 140);

      g.font = '700 34px ui-monospace, monospace';
      g.fillText('ESP32-S3', 64, 232);
      g.font = '700 28px ui-monospace, monospace';
      g.fillText('WROOM-1', 64, 272);

      g.font = '600 21px ui-monospace, monospace';
      g.fillStyle = '#484f5c';
      g.fillText('N16R8  240MHz', 64, 326);
      g.fillText('DUAL-CORE LX7', 64, 358);

      // Tiny QR-like matrix
      g.fillStyle = '#3a404a';
      for (let r = 0; r < 7; r++) {
        for (let col = 0; col < 7; col++) {
          if (((r * 7 + col * 3 + r * col) % 3) !== 0 || (r < 2 && col < 2)) {
            g.fillRect(344 + col * 14, 344 + r * 14, 11, 11);
          }
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function makeAntennaTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 128;
      const g = c.getContext('2d');
      g.fillStyle = '#14181e';
      g.fillRect(0, 0, 256, 128);
      g.strokeStyle = '#d4af52';
      g.lineWidth = 10;
      g.lineCap = 'square';
      g.beginPath();
      g.moveTo(28, 118);
      g.lineTo(28, 28);
      g.lineTo(96, 28);
      g.lineTo(96, 86);
      g.lineTo(154, 86);
      g.lineTo(154, 28);
      g.lineTo(222, 28);
      g.lineTo(222, 92);
      g.stroke();
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    /* ============================================================
     * 3. Geometry Helpers
     * ============================================================ */
    function roundedRectShape(w, h, r) {
      const s = new THREE.Shape();
      const x = -w / 2, y = -h / 2;
      s.moveTo(x + r, y);
      s.lineTo(x + w - r, y);
      s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + h - r);
      s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      s.lineTo(x + r, y + h);
      s.quadraticCurveTo(x, y + h, x, y + h - r);
      s.lineTo(x, y + r);
      s.quadraticCurveTo(x, y, x + r, y);
      return s;
    }

    /* ============================================================
     * 4. Three.js Scene Setup
     * ============================================================ */
    const container = document.getElementById('viewport');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#16191f');
    scene.fog = new THREE.FogExp2('#16191f', 0.022);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.72;

    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(4.8, 6.2, 16.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.075;
    controls.enablePan = false;
    controls.minDistance = 8.5;
    controls.maxDistance = 40;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.target.set(0, 4.45, 0);
    controls.update();

    /* Lights */
    const keyLight = new THREE.DirectionalLight(0xfff7ee, 2.2);
    keyLight.position.set(10, 18, 12);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 2;
    keyLight.shadow.camera.far = 45;
    keyLight.shadow.camera.left = -14;
    keyLight.shadow.camera.right = 14;
    keyLight.shadow.camera.top = 14;
    keyLight.shadow.camera.bottom = -14;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x88c8ff, 0.9);
    rimLight.position.set(-12, 10, -14);
    scene.add(rimLight);

    // Dynamic bounce light fed by real-time LCD average color
    const lcdGlowLight = new THREE.PointLight(0x70e2f4, 2.4, 16, 1.8);
    lcdGlowLight.position.set(0, 4.5, 2.2);
    scene.add(lcdGlowLight);

    /* Cutting Mat Table */
    const matGeo = new THREE.PlaneGeometry(96, 96);
    const matMaterial = new THREE.MeshStandardMaterial({
      map: makeCuttingMatTexture(),
      roughness: 0.86,
      metalness: 0.04,
    });
    const cuttingMat = new THREE.Mesh(matGeo, matMaterial);
    cuttingMat.rotation.x = -Math.PI / 2;
    cuttingMat.receiveShadow = true;
    scene.add(cuttingMat);

    /* ============================================================
     * 5. JingCai ESP32-4848S040C 3D Hardware Assembly (1 unit = 10mm)
     * ============================================================ */
    const devicePivot = new THREE.Group();
    // Slight ergonomic desk-stand tilt, resting cleanly on the cutting mat
    devicePivot.position.set(0, 4.38, 0);
    devicePivot.rotation.x = -0.14;
    scene.add(devicePivot);

    // Physical NS4168 speaker acoustic anchor on the rear PCB (SPK position)
    const speakerAnchor = new THREE.Object3D();
    speakerAnchor.position.set(-2.2, -1.8, -0.58);
    devicePivot.add(speakerAnchor);

    // 5a. Outer dark-metallic frame (86mm x 86mm x 10.2mm)
    const bodyW = 8.6, bodyH = 8.6, bodyD = 0.92;
    const shellGeo = new THREE.ExtrudeGeometry(roundedRectShape(bodyW, bodyH, 0.3), {
      depth: bodyD,
      bevelEnabled: true,
      bevelThickness: 0.07,
      bevelSize: 0.06,
      bevelSegments: 4,
    });
    shellGeo.center();
    const shellMat = new THREE.MeshStandardMaterial({
      color: '#2a2e36',
      metalness: 0.62,
      roughness: 0.34,
    });
    const shellMesh = new THREE.Mesh(shellGeo, shellMat);
    shellMesh.castShadow = true;
    shellMesh.receiveShadow = true;
    devicePivot.add(shellMesh);

    // 5b. Front full-face black cover glass bezel (matching real photo)
    const bezelGeo = new THREE.ShapeGeometry(roundedRectShape(8.46, 8.46, 0.24));
    const bezelMat = new THREE.MeshPhysicalMaterial({
      color: '#0c0d11',
      roughness: 0.08,
      metalness: 0.06,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,

      const distScale = aspect < 1.05 ? (1.05 / Math.max(0.45, aspect)) : 1.0;
      const dir = base.pos.clone().sub(base.target).multiplyScalar(distScale);
      return {
        pos: base.target.clone().add(dir),
        target: base.target.clone(),
      };
    }

    function hitLcd(ev) {
      const rect = renderer.domElement.getBoundingClientRect();
      ndc.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObject(lcdMesh, false);
      if (hits.length === 0 || !hits[0].uv) return null;
      const uv = hits[0].uv;
      return [
        Math.max(0, Math.min(479, Math.floor(uv.x * 480))),
        Math.max(0, Math.min(479, Math.floor((1 - uv.y) * 480))),
      ];
    }

      if (!api || lcdPointerId !== null) return;
      const pt = hitLcd(ev);
      if (!pt) return;
      lcdPointerId = ev.pointerId;
      controls.enabled = false;
      renderer.domElement.setPointerCapture(ev.pointerId);
      api.pointerDown(pt[0], pt[1]);
    }, true);

      if (lcdPointerId === ev.pointerId && api) {

        return;

      if (lcdPointerId === null) {

    /* ============================================================
     * 8.5 Web Audio API: WASM DSP Synth + IR Convolution + 3D HRTF
     * ============================================================ */
    let audioCtx = null;
    let audioNextTime = 0;
    let audioTimer = null;
    let audioGraph = null;
    const AUDIO_CHUNK = 1024;
    const IR_MODES = ['studio', 'hall', 'dry'];
    let irModeIdx = 0; /* default: 'studio' (Hardware Cabinet IR + Desk Studio Stereo IR + HRTF) */

    function mulberry32(seed) {
      let a = seed >>> 0;
      return () => {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    /**
     * Synthesize a minimum-phase-like physical IR for the ESP32-4848S040C
     * PCB-mounted NS4168 micro-speaker & acrylic enclosure (512 samples).
     */
    function buildSpeakerIR(ctx) {
      const sr = ctx.sampleRate;
      const len = Math.max(256, Math.round(sr * 0.012));
      const buf = ctx.createBuffer(1, len, sr);
      const data = buf.getChannelData(0);
      const modes = [
        { f: 880,  q: 4.5, g: 0.24 },  /* internal PCB cavity mode */
        { f: 2650, q: 5.2, g: 0.19 },  /* micro-diaphragm presence */
        { f: 5200, q: 3.8, g: 0.11 },  /* rear grille air shimmer */
      ];
      /* Direct impulse + subtle enclosure resonances */
      data[0] = 0.88;
      data[1] = -0.18; /* gentle sub-200Hz acoustic rolloff differentiator */
      for (let i = 1; i < len; i++) {
        const t = i / sr;
        let s = 0;
        for (const m of modes) {
          const tau = m.q / (Math.PI * m.f);
          s += m.g * Math.exp(-t / tau) * Math.sin(2 * Math.PI * m.f * t);
        }
        /* Subtle housing reflection at ~1.1ms */
        const refl = Math.round(sr * 0.0011);
        if (i === refl) s += 0.14;
        data[i] += s;
      }
      /* Normalize RMS energy to unity so dry/wet switching has zero level jump */
      let e = 0;
      for (let i = 0; i < len; i++) e += data[i] * data[i];
      const norm = 1 / Math.max(0.001, Math.sqrt(e));
      for (let i = 0; i < len; i++) data[i] *= norm;
      return buf;
    }

    /**
     * Synthesize a true stereo 3-band frequency-damped Impulse Response (IR)
     * with image-source binaural early reflections (ITD/ILD) + decorrelated late tail.
     */
    function buildRoomIR(ctx, mode) {
      const sr = ctx.sampleRate;
      const isHall = (mode === 'hall');
      const dur = isHall ? 2.25 : 1.05;
      const len = Math.round(sr * dur);
      const buf = ctx.createBuffer(2, len, sr);

      /* Early reflections: [timeMs, gainL, gainR, itdMs] */
      const early = isHall ? [
        [13.5,  0.52,  0.34,  0.42],
        [19.2,  0.32,  0.50, -0.38],
        [27.8,  0.40,  0.38,  0.22],
        [36.4, -0.36,  0.26,  0.55],
        [44.1,  0.24, -0.35, -0.48],
        [53.7,  0.30,  0.28,  0.31],
        [64.2, -0.22, -0.25, -0.25],
        [75.8,  0.21,  0.19,  0.40],
      ] : [
        /* Cutting-mat desk bounce + near-field studio walls */
        [ 1.8,  0.46,  0.46,  0.00], /* cutting mat bounce */
        [ 4.7,  0.44,  0.24,  0.36], /* left wall */
        [ 6.1,  0.22,  0.42, -0.34], /* right wall */
        [ 9.4, -0.30, -0.28,  0.12], /* ceiling */
        [13.8,  0.26, -0.18,  0.44], /* rear monitor / shelf */
        [18.5, -0.17,  0.24, -0.39], /* right corner */
        [24.2,  0.16,  0.15,  0.22], /* back wall */
        [30.9, -0.12, -0.13, -0.18], /* secondary desk-wall */
      ];

      const rtLow  = isHall ? 2.15 : 0.68;
      const rtMid  = isHall ? 1.75 : 0.50;
      const rtHigh = isHall ? 0.78 : 0.21;
      const preDelayS = Math.round(sr * (isHall ? 0.018 : 0.005));

      for (let ch = 0; ch < 2; ch++) {
        const out = buf.getChannelData(ch);
        const rand = mulberry32(ch === 0 ? (isHall ? 0x243F6A88 : 0x1337C0DE) : (isHall ? 0x85A308D3 : 0xBADC0FFE));

        /* 1. Binaural early reflections with soft 2-sample fractional impulse */
        for (const [ms, gL, gR, itd] of early) {
          const tMs = ms + (ch === 1 ? itd : 0);
          const idx = Math.round(sr * Math.max(0.0005, tMs * 0.001));
          const g = (ch === 0 ? gL : gR) * (isHall ? 0.58 : 0.45);
          if (idx >= 0 && idx + 2 < len) {
            out[idx]     += g * 0.72;
            out[idx + 1] += g * 0.28;
          }
        }

        /* 2. 3-band damped late reverberation tail (Low / Mid / High RT60) */
        const kLow  = 6.907755 / (rtLow * sr);
        const kMid  = 6.907755 / (rtMid * sr);
        const kHigh = 6.907755 / (rtHigh * sr);
        /* 1-pole crossover coefficients */
        const aLo = 1 - Math.exp(-2 * Math.PI * 450 / sr);
        const aHi = 1 - Math.exp(-2 * Math.PI * 3200 / sr);
        let lpLo = 0, lpHi = 0;
        const tailGain = isHall ? 0.34 : 0.22;

        for (let i = preDelayS; i < len; i++) {
          const n = i - preDelayS;
          /* Smooth fade-in of diffuse tail over first 18ms */
          const build = Math.min(1, n / (sr * (isHall ? 0.032 : 0.016)));
          /* Gaussian-like white noise via sum of 2 uniforms */
          const w = (rand() + rand() - 1.0);
          lpLo += aLo * (w - lpLo);
          lpHi += aHi * (w - lpHi);
          const bLow  = lpLo;
          const bMid  = lpHi - lpLo;
          const bHigh = w - lpHi;

          const s = bLow * Math.exp(-kLow * n) * 0.85
                  + bMid * Math.exp(-kMid * n) * 1.00
                  + bHigh * Math.exp(-kHigh * n) * 0.65;
          out[i] += s * build * tailGain;
        }
      }

      /* Normalize stereo IR energy smoothly */
      let energy = 0;
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) energy += d[i] * d[i];
      }
      const norm = (isHall ? 1.15 : 0.92) / Math.max(0.01, Math.sqrt(energy * 0.5));
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] *= norm;
      }
      return buf;
    }

    function applyIrMode() {
      const mode = IR_MODES[irModeIdx];
      btnIr.classList.toggle('active', mode !== 'dry');
      btnIr.textContent = mode === 'studio' ? 'IR' : (mode === 'hall' ? 'HALL' : 'DRY');
      if (!audioGraph || !audioCtx) return;
      const t = audioCtx.currentTime;
      const g = audioGraph;
      if (mode === 'dry') {
        g.cabDry.gain.setTargetAtTime(1.0, t, 0.025);
        g.cabWet.gain.setTargetAtTime(0.0, t, 0.025);
        g.directOut.gain.setTargetAtTime(0.0, t, 0.025);
        g.bypassOut.gain.setTargetAtTime(1.0, t, 0.025);
        g.studioSend.gain.setTargetAtTime(0.0, t, 0.025);
        g.hallSend.gain.setTargetAtTime(0.0, t, 0.025);
      } else if (mode === 'studio') {
        g.cabDry.gain.setTargetAtTime(0.58, t, 0.025);
        g.cabWet.gain.setTargetAtTime(0.46, t, 0.025);
        g.directOut.gain.setTargetAtTime(0.95, t, 0.025);
        g.bypassOut.gain.setTargetAtTime(0.0, t, 0.025);
        g.studioSend.gain.setTargetAtTime(0.38, t, 0.025);
        g.hallSend.gain.setTargetAtTime(0.0, t, 0.025);
      } else { /* 'hall' */
        g.cabDry.gain.setTargetAtTime(0.80, t, 0.025);
        g.cabWet.gain.setTargetAtTime(0.24, t, 0.025);
        g.directOut.gain.setTargetAtTime(0.86, t, 0.025);
        g.bypassOut.gain.setTargetAtTime(0.0, t, 0.025);
        g.studioSend.gain.setTargetAtTime(0.0, t, 0.025);
        g.hallSend.gain.setTargetAtTime(0.56, t, 0.025);
      }
    }

    function initAudioGraph(ctx) {
      const input = ctx.createGain();
      input.gain.value = 1.0;

      /* Stage 1: Physical Hardware Speaker/Enclosure IR */
      const cabDry = ctx.createGain();
      const cabWet = ctx.createGain();
      const cabConv = ctx.createConvolver();
      cabConv.normalize = false;
      cabConv.buffer = buildSpeakerIR(ctx);

      const cabSum = ctx.createGain();
      input.connect(cabDry);
      input.connect(cabConv);
      cabConv.connect(cabWet);
      cabDry.connect(cabSum);
      cabWet.connect(cabSum);

      /* Stage 2: Front-Glass vs Rear-PCB Acoustic Diffraction Filter */
      const diffFilter = ctx.createBiquadFilter();
      diffFilter.type = 'lowpass';
      diffFilter.frequency.value = 14000;
      diffFilter.Q.value = 0.65;

      /* Stage 3: Binaural 3D HRTF Panner anchored to the 3D ESP32-S3 PCB Speaker */
      const panner = ctx.createPanner();
      panner.panningModel = 'HRTF';
      panner.distanceModel = 'inverse';
      panner.refDistance = 0.18;
      panner.maxDistance = 4.0;
      panner.rolloffFactor = 0.65;
      panner.coneInnerAngle = 110;
      panner.coneOuterAngle = 250;
      panner.coneOuterGain = 0.68;

      const directOut = ctx.createGain();
      cabSum.connect(diffFilter);
      diffFilter.connect(panner);
      panner.connect(directOut);

      /* Stage 4: Dual Stereo Spatial Room IR Convolvers (Click-free Crossfade) */
      const studioSend = ctx.createGain();
      const studioConv = ctx.createConvolver();
      studioConv.normalize = false;
      studioConv.buffer = buildRoomIR(ctx, 'studio');
      cabSum.connect(studioSend);
      studioSend.connect(studioConv);

      const hallSend = ctx.createGain();
      const hallConv = ctx.createConvolver();
      hallConv.normalize = false;
      hallConv.buffer = buildRoomIR(ctx, 'hall');
      cabSum.connect(hallSend);
      hallSend.connect(hallConv);

      /* Direct DRY bypass path (for instant A/B comparison) */
      const bypassOut = ctx.createGain();
      bypassOut.gain.value = 0.0;
      input.connect(bypassOut);

      /* Master Bus Limiter / Dynamics Protection */
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -10;
      comp.knee.value = 12;
      comp.ratio.value = 4;
      comp.attack.value = 0.003;
      comp.release.value = 0.12;

      directOut.connect(comp);
      studioConv.connect(comp);
      hallConv.connect(comp);
      bypassOut.connect(comp);
      comp.connect(ctx.destination);

      audioGraph = {
        input, cabDry, cabWet, diffFilter, panner, directOut,
        studioSend, hallSend, bypassOut,
      };
      applyIrMode();
    }

    const _spkPos = new THREE.Vector3();
    const _spkFwd = new THREE.Vector3();
    const _camFwd = new THREE.Vector3();
    const _camUp  = new THREE.Vector3();
    const _toCam  = new THREE.Vector3();
    const _devQuat = new THREE.Quaternion();

    function updateSpatialAudio() {
      if (!audioCtx || !audioGraph || audioCtx.state !== 'running') return;
      const t = audioCtx.currentTime;
      const S = 0.01; /* Three.js scene scale: 1 unit = 10mm = 0.01m */

      /* Sync AudioListener to Three.js Camera */
      const L = audioCtx.listener;
      camera.getWorldDirection(_camFwd);
      _camUp.set(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
      if (L.positionX) {
        L.positionX.setValueAtTime(camera.position.x * S, t);
        L.positionY.setValueAtTime(camera.position.y * S, t);
        L.positionZ.setValueAtTime(camera.position.z * S, t);
        L.forwardX.setValueAtTime(_camFwd.x, t);
        L.forwardY.setValueAtTime(_camFwd.y, t);
        L.forwardZ.setValueAtTime(_camFwd.z, t);
        L.upX.setValueAtTime(_camUp.x, t);
        L.upY.setValueAtTime(_camUp.y, t);
        L.upZ.setValueAtTime(_camUp.z, t);
      } else if (L.setPosition) {
        L.setPosition(camera.position.x * S, camera.position.y * S, camera.position.z * S);
        L.setOrientation(_camFwd.x, _camFwd.y, _camFwd.z, _camUp.x, _camUp.y, _camUp.z);
      }

      /* Sync PannerNode to the Rear PCB Speaker Anchor */
      speakerAnchor.getWorldPosition(_spkPos);
      devicePivot.getWorldQuaternion(_devQuat);
      _spkFwd.set(0, 0, -1).applyQuaternion(_devQuat).normalize();
      const P = audioGraph.panner;
      if (P.positionX) {
        P.positionX.setValueAtTime(_spkPos.x * S, t);
        P.positionY.setValueAtTime(_spkPos.y * S, t);
        P.positionZ.setValueAtTime(_spkPos.z * S, t);
        P.orientationX.setValueAtTime(_spkFwd.x, t);
        P.orientationY.setValueAtTime(_spkFwd.y, t);
        P.orientationZ.setValueAtTime(_spkFwd.z, t);
      } else if (P.setPosition) {
        P.setPosition(_spkPos.x * S, _spkPos.y * S, _spkPos.z * S);
        P.setOrientation(_spkFwd.x, _spkFwd.y, _spkFwd.z);
      }

      /* Physical Bezel Diffraction: subtly brighter when viewing open PCB rear, warm diffraction from front glass */
      _toCam.copy(camera.position).sub(_spkPos).normalize();
      const rearFacing = _spkFwd.dot(_toCam); /* -1 = front LCD view, +1 = open rear PCB view */
      const u = Math.max(0, Math.min(1, (rearFacing + 1) * 0.5));
      const cutHz = 9200 + u * 10200;
      audioGraph.diffFilter.frequency.setTargetAtTime(cutHz, t, 0.04);
    }

    function syncSfxButton() {
      if (!api) return;
      const on = api.sfxIsMuted() === 0;
      btnSfx.classList.toggle('active', on);
      btnSfx.textContent = on ? 'SFX' : 'MUTE';
    }

    function pumpAudio() {
      if (!audioCtx || !audioGraph || !api || !mod || audioCtx.state !== 'running') return;
      if (api.sfxIsMuted()) {
        audioNextTime = audioCtx.currentTime;
        return;
      }
      const now = audioCtx.currentTime;
      if (audioNextTime < now) audioNextTime = now + 0.015;
      const horizon = now + 0.085;
      while (audioNextTime < horizon) {
        const ptr = api.audioRender(AUDIO_CHUNK);
        const samples = mod.HEAPF32.subarray(ptr >> 2, (ptr >> 2) + AUDIO_CHUNK);
        let silent = true;
        for (let i = 0; i < AUDIO_CHUNK; i++) {
          if (samples[i] !== 0) { silent = false; break; }
        }
        if (!silent) {
          const buf = audioCtx.createBuffer(1, AUDIO_CHUNK, audioCtx.sampleRate);
          buf.copyToChannel(samples, 0);
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          src.connect(audioGraph.input);
          src.start(audioNextTime);
        }
        audioNextTime += AUDIO_CHUNK / audioCtx.sampleRate;
      }
    }

    function ensureAudioUnlocked() {
      if (!api) return;
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
        api.audioSetRate(audioCtx.sampleRate);
        initAudioGraph(audioCtx);
        updateSpatialAudio();
        audioNextTime = audioCtx.currentTime;
        audioTimer = setInterval(pumpAudio, 15);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    window.addEventListener('pointerdown', ensureAudioUnlocked, { capture: true, passive: true });
    window.addEventListener('keydown', ensureAudioUnlocked, { capture: true, passive: true });

    btnSfx.addEventListener('click', () => {
      if (!api) return;
      ensureAudioUnlocked();
      const nextMute = api.sfxIsMuted() ? 0 : 1;
      api.sfxSetMuted(nextMute);
      if (!nextMute) api.sfxPlay(1); /* SFX_CONFIRM */
      syncSfxButton();
    });

    btnIr.addEventListener('click', () => {
      if (!api) return;
      ensureAudioUnlocked();
      irModeIdx = (irModeIdx + 1) % IR_MODES.length;
      applyIrMode();
      if (!api.sfxIsMuted()) api.sfxPlay(10); /* SFX_CRYSTAL audition chime */
    });

    /* ============================================================
     * 9. Boot WASM Core & Main 60Hz Loop
     * ============================================================ */
    const urlParams = new URLSearchParams(location.search);
    const startView = urlParams.get('view');
    if (startView && BASE_VIEWS[startView]) {
      setView(startView, true);
    }

    const imgData = lcdCtx.createImageData(480, 480);
    let mod = null;

    function updateGlowColor(bytes) {
      let r = 0, g = 0, b = 0, n = 0;
      for (let y = 80; y < 400; y += 32) {
        for (let x = 40; x < 440; x += 40) {
          const idx = (y * 480 + x) * 4;
          r += bytes[idx];
          g += bytes[idx + 1];
          b += bytes[idx + 2];
          n++;
        }
      }
      if (n > 0) {
        lcdGlowLight.color.setRGB(
          Math.min(1, (r / n) / 200),
          Math.min(1, (g / n) / 200),
          Math.min(1, (b / n) / 200)
        );
      }
    }

    function blitLcd(sampleGlow) {
      if (!api || !mod) return;
      const ptr = api.getRgbaPtr();
      const bytes = mod.HEAPU8.subarray(ptr, ptr + 480 * 480 * 4);
      imgData.data.set(bytes);
      lcdCtx.putImageData(imgData, 0, 0);
      lcdTexture.needsUpdate = true;
      if (sampleGlow) updateGlowColor(bytes);
    }

    createCrystalGarden().then((Module) => {
      mod = Module;
      api = {
        init: Module.cwrap('emu_init', null, []),
        step: Module.cwrap('emu_step', null, ['number']),
        render: Module.cwrap('emu_render', null, []),
        getRgbaPtr: Module.cwrap('emu_get_rgba_ptr', 'number', []),
        pointerDown: Module.cwrap('emu_pointer_down', null, ['number', 'number']),
        pointerMove: Module.cwrap('emu_pointer_move', null, ['number', 'number']),
        pointerUp: Module.cwrap('emu_pointer_up', null, ['number', 'number']),
        sendCommand: Module.cwrap('emu_send_command', null, ['string']),
        save: Module.cwrap('emu_save', null, []),
        audioSetRate: Module.cwrap('emu_audio_set_rate', null, ['number']),
        audioRender: Module.cwrap('emu_audio_render', 'number', ['number']),
        sfxSetMuted: Module.cwrap('emu_sfx_set_muted', null, ['number']),
        sfxIsMuted: Module.cwrap('emu_sfx_is_muted', 'number', []),
        sfxPlay: Module.cwrap('emu_sfx_play', null, ['number']),
      };

      api.init();
      syncSfxButton();
      const initCmd = urlParams.get('cmd');
      if (initCmd) {
        initCmd.split(';').forEach((c) => { if (c.trim()) api.sendCommand(c.trim()); });
        api.step(1 / 60);
        api.render();
      }
      const skipFrames = Math.min(600, Math.max(0, Number(urlParams.get('f') || 0) | 0));
      for (let i = 0; i < skipFrames; i++) api.step(1 / 60);
      if (skipFrames > 0) api.render();
      blitLcd(true);

      const veil = document.getElementById('veil');
      veil.classList.add('gone');
      setTimeout(() => veil.remove(), 400);

      window.addEventListener('pagehide', () => api.save());

      const STEP_MS = 1000 / 60;
      let lastT = performance.now();
      let accum = 0;
      let frameIdx = 0;

      function animate(now) {
        requestAnimationFrame(animate);

        const dtMs = Math.min(100, now - lastT);
        lastT = now;

        accum += dtMs * speedMult;
        let steps = 0;
        const maxSteps = speedMult >= 2 ? 4 : 2;
        while (accum >= STEP_MS && steps < maxSteps) {
          api.step(1 / 60);
          accum -= STEP_MS;
          steps++;
        }
        if (steps > 0) {
          api.render();
          blitLcd((frameIdx++ % 10) === 0);
          if ((frameIdx % 15) === 0) syncSfxButton();
        }

        // Subtle status LED heartbeat on PCB
        const pulse = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(now * 0.006));
        actLedMat.color.setRGB(0.18 * pulse, 0.85 * pulse, 1.0 * pulse);

        // Smooth camera transition
        if (camAnim) {
          const u = Math.min(1, (now - camAnim.t0) / camAnim.dur);
          const ease = 1 - Math.pow(1 - u, 3);
          camera.position.lerpVectors(camAnim.p0, camAnim.p1, ease);
          controls.target.lerpVectors(camAnim.tStart, camAnim.tEnd, ease);
          if (u >= 1) camAnim = null;
        }

        controls.update();
        updateSpatialAudio();
        renderer.render(scene, camera);
      }

      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
