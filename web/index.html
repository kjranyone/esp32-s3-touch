<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ESP32-S3 · Crystal Garden</title>
  <style>
    :root {
      --fg: rgba(235, 242, 255, 0.88);
      --muted: rgba(176, 192, 218, 0.58);
      --accent: #70e2f4;
      --glass: rgba(15, 19, 28, 0.56);
      --glass-border: rgba(255, 255, 255, 0.11);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #14171d;
      color: var(--fg);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Minimal corner stamp */
    .corner-tl {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      left: max(20px, env(safe-area-inset-left));
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .dot-live {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ef09a;
      box-shadow: 0 0 8px rgba(78, 240, 154, 0.8);
    }

    .corner-tr {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-link {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: color 0.15s, border-color 0.15s;
    }

    .icon-link:hover {
      color: #fff;
      border-color: rgba(112, 226, 244, 0.4);
    }

    /* Bottom floating pill */
    .dock {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    .pill-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .pill-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.07); }
    .pill-btn.active { color: #0b1018; background: var(--accent); }

    .pill-sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }

    /* Minimal hidden serial popover */
    .serial-pop {
      position: fixed;
      left: 50%;
      bottom: calc(max(18px, env(safe-area-inset-bottom)) + 52px);
      transform: translateX(-50%);
      width: min(380px, calc(100vw - 28px));
      padding: 10px;
      border-radius: 14px;
      background: rgba(10, 13, 20, 0.86);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 12;
    }

    .serial-pop.open { display: flex; }

    .serial-out {
      height: 124px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.45;
      color: #a9e9f8;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
    }

    .serial-row {
      display: flex;
      gap: 6px;
    }

    .serial-in {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 6px 10px;
      color: #fff;
      font-family: var(--mono);
      font-size: 11px;
      outline: none;
    }

    .serial-in:focus { border-color: var(--accent); }

    /* Minimal credit */
    .credit {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.04em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 5;
    }

    .credit a {
      color: rgba(220, 234, 255, 0.72);
      text-decoration: none;
      transition: color 0.15s;
    }

    .credit a:hover { color: var(--accent); }

    @media (max-width: 960px) {
      .credit {
        left: 50%;
        right: auto;
        bottom: max(68px, calc(env(safe-area-inset-bottom) + 64px));
        transform: translateX(-50%);
        white-space: nowrap;
        font-size: 10px;
      }
      .serial-pop {
        bottom: calc(max(18px, env(safe-area-inset-bottom)) + 88px);
      }
    }

    /* Boot veil & cinematic intro chrome reveal */
    .veil {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #080a0f;
      z-index: 30;
      transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .veil.gone {
      opacity: 0;
      pointer-events: none;
    }

    body.intro-playing .dock,
    body.intro-playing .corner-tl,
    body.intro-playing .corner-tr,
    body.intro-playing .credit {
      opacity: 0;
      pointer-events: none;
    }

    .dock, .corner-tl, .corner-tr, .credit {
      transition: opacity 0.55s ease;
    }

    .pulse {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(112, 226, 244, 0.22);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="viewport"></div>

  <div class="corner-tl">
    <span class="dot-live"></span>
    <span>ESP32-S3</span>
  </div>

  <div class="corner-tr">
    <a class="icon-link" href="https://github.com/kjranyone/esp32-s3-touch" target="_blank" rel="noopener">GitHub ↗</a>
  </div>

  <div class="serial-pop" id="serial-pop">
    <div class="serial-out" id="serial-out"></div>
    <form class="serial-row" id="serial-form">
      <input class="serial-in" id="serial-in" type="text" autocomplete="off" spellcheck="false" placeholder="UART 115200 (boss / ult / box / wave 50 / ?)" />
      <button class="pill-btn active" type="submit">TX</button>
    </form>
  </div>

  <nav class="dock" aria-label="View controls">
    <button class="pill-btn active" data-view="iso">3D</button>
    <button class="pill-btn" data-view="front">FRONT</button>
    <button class="pill-btn" data-view="pcb">PCB</button>
    <span class="pill-sep"></span>
    <button class="pill-btn" id="btn-speed">1x</button>
    <button class="pill-btn active" id="btn-sfx" title="Sound Effects">SFX</button>
    <button class="pill-btn active" id="btn-ir" title="IR Spatial Acoustics (STUDIO / HALL / DRY)">IR</button>
    <button class="pill-btn" id="btn-uart" title="UART">&gt;_</button>
  </nav>

  <footer class="credit">
    <span>Created by Kojiro Tanaka</span>
    <span>·</span>
    <a href="https://x.com/mu_sette" target="_blank" rel="noopener">@mu_sette</a>
    <span>·</span>
    <a href="https://oto-nari.com" target="_blank" rel="noopener">oto-nari.com</a>
  </footer>

  <div class="veil" id="veil"><div class="pulse"></div></div>

  <script src="crystal_garden.js"></script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    /* ============================================================
     * 1. Offscreen 480x480 LCD Surface (WASM Framebuffer Target)
     * ============================================================ */
    const lcdCanvas = document.createElement('canvas');
    lcdCanvas.width = 480;
    lcdCanvas.height = 480;
    const lcdCtx = lcdCanvas.getContext('2d', { alpha: false });
    lcdCtx.fillStyle = '#070a12';
    lcdCtx.fillRect(0, 0, 480, 480);

    const lcdTexture = new THREE.CanvasTexture(lcdCanvas);
    lcdTexture.colorSpace = THREE.SRGBColorSpace;
    lcdTexture.minFilter = THREE.LinearFilter;
    lcdTexture.magFilter = THREE.NearestFilter;
    lcdTexture.generateMipmaps = false;

    /* ============================================================
     * 2. Procedural Textures (Cutting Mat & ESP32-S3 Back PCB)
     * ============================================================ */
    function makeCuttingMatTexture() {
      const c = document.createElement('canvas');
      c.width = 2048;
      c.height = 2048;
      const g = c.getContext('2d');

      g.fillStyle = '#252930';
      g.fillRect(0, 0, 2048, 2048);

      // Subtle matte grain
      g.fillStyle = 'rgba(255,255,255,0.014)';
      for (let i = 0; i < 14000; i++) {
        g.fillRect((Math.random() * 2048) | 0, (Math.random() * 2048) | 0, 2, 2);
      }

      const step = 64; // 10mm grid
      // Fine 10mm grid
      g.strokeStyle = 'rgba(220, 230, 242, 0.14)';
      g.lineWidth = 1.5;
      g.beginPath();
      for (let x = 0; x <= 2048; x += step) {
        g.moveTo(x, 0); g.lineTo(x, 2048);
        g.moveTo(0, x); g.lineTo(2048, x);
      }
      g.stroke();

      // Major 50mm grid
      g.strokeStyle = 'rgba(235, 242, 250, 0.28)';
      g.lineWidth = 2.4;
      g.beginPath();
      for (let x = 0; x <= 2048; x += step * 5) {
        g.moveTo(x, 0); g.lineTo(x, 2048);
        g.moveTo(0, x); g.lineTo(2048, x);
      }
      g.stroke();

      // Diagonal angle guide lines (like real cutting mat)
      g.strokeStyle = 'rgba(220, 230, 242, 0.12)';
      g.lineWidth = 1.5;
      g.beginPath();
      g.moveTo(0, 2048); g.lineTo(2048, 0);
      g.moveTo(0, 1024); g.lineTo(1024, 0);
      g.moveTo(1024, 2048); g.lineTo(2048, 1024);
      g.stroke();

      // Center cross ticks
      g.fillStyle = 'rgba(225, 235, 245, 0.24)';
      g.font = '600 18px ui-monospace, monospace';
      for (let i = 1; i <= 6; i++) {
        g.fillText(String(i * 5), i * step * 5 + 6, 2048 - 14);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      tex.anisotropy = 8;
      return tex;
    }

    /* ============================================================
     * 2. Physically Accurate ESP32-4848S040C PCB Texture (2048x2048)
     *    1:1 coordinate projection with backGroup (79.2mm x 79.2mm)
     * ============================================================ */
    const PCB_SIZE = 7.92;
    const PCB_TEX_N = 2048;
    const pcbX = (x) => ((x + PCB_SIZE * 0.5) / PCB_SIZE) * PCB_TEX_N;
    const pcbY = (y) => ((PCB_SIZE * 0.5 - y) / PCB_SIZE) * PCB_TEX_N;
    const pcbLen = (u) => (u / PCB_SIZE) * PCB_TEX_N;

    function makePcbTexture() {
      const c = document.createElement('canvas');
      c.width = PCB_TEX_N;
      c.height = PCB_TEX_N;
      const g = c.getContext('2d');

      const drawTrace = (pts, wMm = 0.20, col = '#1b6a42', clearance = true) => {
        if (pts.length < 2) return;
        const wPx = Math.max(2, pcbLen(wMm * 0.1));
        g.lineCap = 'round';
        g.lineJoin = 'round';
        if (clearance) {
          g.strokeStyle = '#082616';
          g.lineWidth = wPx + 5;
          g.beginPath();
          g.moveTo(pcbX(pts[0][0]), pcbY(pts[0][1]));
          for (let i = 1; i < pts.length; i++) g.lineTo(pcbX(pts[i][0]), pcbY(pts[i][1]));
          g.stroke();
        }
        g.strokeStyle = col;
        g.lineWidth = wPx;
        g.beginPath();
        g.moveTo(pcbX(pts[0][0]), pcbY(pts[0][1]));
        for (let i = 1; i < pts.length; i++) g.lineTo(pcbX(pts[i][0]), pcbY(pts[i][1]));
        g.stroke();
      };

      const drawVia = (x, y, rMm = 0.28, tented = false) => {
        const px = pcbX(x), py = pcbY(y), r = pcbLen(rMm * 0.1);
        g.fillStyle = tented ? '#1b643f' : '#d8b454';
        g.beginPath(); g.arc(px, py, r, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#050b07';
        g.beginPath(); g.arc(px, py, r * 0.44, 0, Math.PI * 2); g.fill();
      };

      const drawPad = (x, y, w, h, col = '#d8b454') => {
        const px = pcbX(x), py = pcbY(y), pw = pcbLen(w), ph = pcbLen(h);
        g.fillStyle = '#072214';
        g.fillRect(px - pw * 0.5 - 3, py - ph * 0.5 - 3, pw + 6, ph + 6);
        g.fillStyle = col;
        g.fillRect(px - pw * 0.5, py - ph * 0.5, pw, ph);
      };

      const drawOutline = (x, y, w, h, lbl = '', lx = null, ly = null) => {
        const px = pcbX(x), py = pcbY(y), pw = pcbLen(w), ph = pcbLen(h);
        g.strokeStyle = 'rgba(240, 246, 242, 0.78)';
        g.lineWidth = 3;
        g.strokeRect(px - pw * 0.5, py - ph * 0.5, pw, ph);
        if (lbl) {
          g.fillStyle = 'rgba(242, 248, 244, 0.88)';
          g.font = '700 22px ui-monospace, monospace';
          g.fillText(lbl, pcbX(lx !== null ? lx : x - w * 0.5), pcbY(ly !== null ? ly : y + h * 0.5 + 0.12));
        }
      };

      /* 1. Base FR4 Substrate & Emerald Guition/JingCai Ground Copper Pour */
      g.fillStyle = '#092b19';
      g.fillRect(0, 0, PCB_TEX_N, PCB_TEX_N);

      /* Main GND copper plane pour (inset 1.2mm from board edge) */
      g.fillStyle = '#124b2e';
      const inset = pcbLen(0.14);
      g.fillRect(inset, inset, PCB_TEX_N - inset * 2, PCB_TEX_N - inset * 2);

      /* Subtle glass-weave FR4 texture */
      g.strokeStyle = 'rgba(255, 255, 255, 0.018)';
      g.lineWidth = 1;
      for (let i = 0; i < PCB_TEX_N; i += 16) {
        g.beginPath(); g.moveTo(i, 0); g.lineTo(i, PCB_TEX_N); g.stroke();
        g.beginPath(); g.moveTo(0, i); g.lineTo(PCB_TEX_N, i); g.stroke();
      }

      /* 2. STRICT RF ANTENNA KEEP-OUT ZONE under U1 (ESP32-S3-WROOM-1 PCB Antenna) */
      const koX0 = pcbX(0.12), koY0 = pcbY(3.92), koW = pcbLen(1.96), koH = pcbLen(1.98);
      g.fillStyle = '#072214'; /* bare substrate, ZERO copper pour under 2.4GHz antenna */
      g.fillRect(koX0, koY0, koW, koH);
      g.save();
      g.beginPath(); g.rect(koX0, koY0, koW, koH); g.clip();
      g.strokeStyle = 'rgba(240, 246, 242, 0.16)';
      g.lineWidth = 2;
      for (let k = -koH; k < koW + koH; k += 22) {
        g.beginPath(); g.moveTo(koX0 + k, koY0); g.lineTo(koX0 + k - koH, koY0 + koH); g.stroke();
      }
      g.restore();
      g.strokeStyle = 'rgba(240, 246, 242, 0.45)';
      g.setLineDash([10, 8]);
      g.lineWidth = 2.5;
      g.strokeRect(koX0, koY0, koW, koH);
      g.setLineDash([]);
      g.fillStyle = 'rgba(240, 246, 242, 0.55)';
      g.font = '700 18px ui-monospace, monospace';
      g.fillText('ANTENNA KEEP-OUT', pcbX(0.24), pcbY(3.56));

      /* 3. REAL 20-LINE 45° MITERED ST7701 PARALLEL RGB565 BUS (U1 Left & Bottom -> CN1 40P FPC) */
      /* Left bank: IO4,5,6,7,15,16(HSYNC),17(VSYNC),18(DE),3(G2) -> CN1 left half */
      for (let i = 0; i < 10; i++) {
        const uy = 1.62 - i * 0.127; /* exact 1.27mm WROOM pin pitch */
        const cx = -0.82 + i * 0.085;
        const turnY = -0.58 - i * 0.062;
        const turnX = -0.08 - i * 0.072;
        const pts = [[0.20, uy], [turnX, uy], [turnX - 0.14, uy - 0.14], [cx, turnY], [cx, -1.32]];
        /* Length-matching serpentine meander on DE (i=7) */
        if (i === 7) {
          pts.splice(3, 0, [cx + 0.04, turnY + 0.20], [cx - 0.04, turnY + 0.14], [cx + 0.04, turnY + 0.08]);
        }
        drawTrace(pts, 0.18, '#1f7a4c');
        drawVia(turnX - 0.07, uy - 0.07, 0.22, true);
      }

      /* Bottom bank: IO8,46,9,10,11,12,13,14,21(PCLK),20(G1) -> CN1 right half */
      for (let i = 0; i < 10; i++) {
        const ux = 0.40 + i * 0.127;
        const cx = 0.12 + i * 0.092;
        const midY = -0.56 - (9 - i) * 0.055;
        const pts = [[ux, -0.22], [ux, midY], [cx, midY - Math.abs(ux - cx) * 0.7], [cx, -1.32]];
        /* Serpentine length-match on PCLK (IO21, i=8) */
        if (i === 8) {
          const mx = (ux + cx) * 0.5;
          pts.splice(2, 0, [mx + 0.06, midY - 0.08], [mx - 0.06, midY - 0.16], [mx + 0.06, midY - 0.24]);
        }
        drawTrace(pts, 0.18, '#228352');
      }

      /* 4. REAL 3-WIRE SPI INIT (IO39 CS, IO48 SCK, IO47 SDA) + BL_PWM (IO38) */
      drawTrace([[2.00, 0.86], [2.22, 0.86], [2.22, -1.02], [1.30, -1.02], [1.22, -1.32]], 0.18, '#1f7a4c');
      drawTrace([[2.00, 0.73], [2.30, 0.73], [2.30, -1.10], [1.38, -1.10], [1.30, -1.32]], 0.18, '#1f7a4c');
      /* IO38 BL_PWM -> U5 Backlight Boost -> L1 22uH -> D1 SS14 -> CN1 LEDA/K */
      drawTrace([[2.00, 0.60], [2.38, 0.60], [2.38, -2.52], [-1.32, -2.52], [-1.62, -2.22], [-1.62, -1.78]], 0.20, '#238a56');
      drawTrace([[-1.85, -1.55], [-1.32, -1.55], [-1.05, -1.55]], 0.45, '#2b9c62'); /* 19V LEDA wide trace */

      /* 5. REAL I2S AUDIO / RELAY MUX BUS (IO1 BCLK, IO2 LRCK, IO40 DOUT) -> R21-23 / R25-27 */
      const i2sYs = [1.49, 1.36, 0.99]; /* U1 right-side IO1, IO2, IO40 */
      for (let i = 0; i < 3; i++) {
        const y0 = i2sYs[i];
        const rx = 2.08 + i * 0.09;
        const jx = -1.62 + i * 0.18;
        /* Route from U1 right edge down to the R21-23 / R25-27 mux area */
        drawTrace([[2.00, y0], [rx + 0.36, y0], [rx + 0.36, -0.35 - i * 0.14], [2.52, -0.35 - i * 0.14]], 0.22, '#248c58'); /* branch to J3 Relay */
        drawTrace([[2.00, y0], [rx, y0], [rx, -2.62 - i * 0.08], [jx, -2.62 - i * 0.08], [jx, -2.22]], 0.20, '#248c58'); /* branch to R21-23 -> NS4168 */
        /* R21..R23 populated (I2S enabled) -> U3 NS4168 */
        drawTrace([[jx, -2.14], [jx - 0.42, -2.14 - i * 0.08], [-2.35, -2.14 - i * 0.08]], 0.20, '#289860');
      }
      /* NS4168 Class-D differential speaker out SPK+/SPK- -> J2 JST */
      drawTrace([[-2.68, -2.42], [-2.68, -2.86]], 0.38, '#2ea468');
      drawTrace([[-2.46, -2.42], [-2.46, -2.86]], 0.38, '#2ea468');

      /* 6. REAL USB-C (CC1/CC2 5.1K) -> DIFFERENTIAL D+/D- PAIR -> U2 CH340C -> Q1/Q2 AUTO-RESET -> U1 TX/RX */
      /* Tightly coupled USB D+/D- differential pair */
      drawTrace([[-0.12, -3.25], [-0.12, -2.84], [-1.72, -1.24], [-1.72, -0.52]], 0.22, '#289a62');
      drawTrace([[ 0.12, -3.25], [ 0.12, -2.76], [-1.58, -1.06], [-1.58, -0.52]], 0.22, '#289a62');
      /* 5V VBUS power rail (wide 0.8mm copper trace): USB-C -> U4 AMS1117-3.3 & J3 & U5 */
      drawTrace([[0.36, -3.28], [0.36, -3.02], [2.40, -3.02], [2.40, -2.18]], 0.72, '#2ea86a');
      drawTrace([[2.40, -1.72], [2.40, -0.95], [2.02, -0.95]], 0.62, '#2ea86a'); /* 3V3 rail */
      /* CH340C TXD/RXD -> U1 IO43/IO44 */
      drawTrace([[-1.45, -0.22], [-0.85, -0.22], [-0.55, 0.08], [0.20, 0.08]], 0.18, '#1f7a4c');
      drawTrace([[-1.45, -0.34], [-0.90, -0.34], [-0.55, -0.02], [0.20, -0.02]], 0.18, '#1f7a4c');

      drawTrace([[0.20, 1.88], [-0.95, 1.88], [-1.42, 2.35], [-2.22, 2.35]], 0.20, '#228654');
      drawTrace([[0.20, 1.76], [-1.02, 1.76], [-1.49, 2.23], [-2.22, 2.23]], 0.20, '#228654');
      for (let i = 0; i < 4; i++) {
        const ty = 1.24 - i * 0.14;
        drawTrace([[0.20, ty], [-0.72 - i * 0.08, ty], [-1.18, ty - 0.12], [-1.85, ty - 0.12]], 0.18, '#1f784a');
      }

      /* 8. Perimeter GND Stitching Vias & RF Shield Via Fence (classic real-board signature!) */
      for (let t = -3.45; t <= 3.45; t += 0.55) {
        if (Math.abs(t) < 2.8) {

          drawVia(t, -3.74, 0.26);
        }
        if (Math.abs(t) < 2.9) {

          drawVia(3.74, t, 0.26);
        }
      }
      /* Via fence along U1 RF ground boundary */
      for (let i = 0; i < 7; i++) {

      }

      /* 9. 4x M2.5 Plated Mounting Holes with ENIG Thermal Relief Ring */
      for (const [mx, my] of [[-3.52, 3.52], [3.52, 3.52], [-3.52, -3.52], [3.52, -3.52]]) {
        const px = pcbX(mx), py = pcbY(my);
        g.fillStyle = '#072214';
        g.beginPath(); g.arc(px, py, pcbLen(0.32), 0, Math.PI * 2); g.fill();
        g.fillStyle = '#d8b454';
        g.beginPath(); g.arc(px, py, pcbLen(0.26), 0, Math.PI * 2); g.fill();
        g.fillStyle = '#070a0d';
        g.beginPath(); g.arc(px, py, pcbLen(0.145), 0, Math.PI * 2); g.fill();
        /* 8 radial via-in-pad dots around mounting ring */
        for (let k = 0; k < 8; k++) {
          const ang = (k * Math.PI) / 4;
          g.fillStyle = '#0b1014';
          g.beginPath();

      /* 3x Optical Alignment Fiducial Marks (ENIG copper dot + solder mask clearance ring) */
      for (const [fx, fy] of [[-3.48, 2.55], [3.25, 2.95], [-3.25, -2.95]]) {
        const px = pcbX(fx), py = pcbY(fy);
        g.fillStyle = '#072214';
        g.beginPath(); g.arc(px, py, pcbLen(0.12), 0, Math.PI * 2); g.fill();
        g.fillStyle = '#e0bd5c';
        g.beginPath(); g.arc(px, py, pcbLen(0.055), 0, Math.PI * 2); g.fill();
      }

      /* 10. R21-R23 (I2S 0-ohm populated) vs R25-R27 (Relay DNP empty ENIG pads) — famous ESP32-4848S040 detail! */
      for (let i = 0; i < 3; i++) {

      drawPad(-0.62, -3.26, 0.07, 0.07); drawPad(-0.62, -3.38, 0.07, 0.07);
      drawPad( 0.62, -3.26, 0.07, 0.07); drawPad( 0.62, -3.38, 0.07, 0.07);

      /* 11. Authentic Crisp White Silkscreen Legends & Component Courtyards */

      g.fillText('ST7701 RGB565 · GT911 · NS4168', pcbX(-2.96), pcbY(2.94));

      /* Pin-1 indicator dots & Reference Designators */
      drawOutline(1.10, 1.05, 1.88, 2.62, 'U1 ESP32-S3-WROOM-1', 0.12, -0.44);
      g.fillStyle = '#ffffff';
      g.beginPath(); g.arc(pcbX(0.08), pcbY(1.74), 7, 0, Math.PI * 2); g.fill(); /* U1 Pin 1 */

      drawOutline(0.20, -1.55, 2.58, 0.58, 'CN1 40P RGB565 FPC', -1.08, -2.26);

      drawOutline(-1.72, -1.55, 0.86, 0.70, 'L1 22uH / U5 BL', -2.26, -1.10);
      drawOutline(-2.58, -2.25, 0.64, 0.54, 'U3 NS4168', -3.02, -1.86);
      drawOutline(-2.58, -2.96, 0.78, 0.54, 'J2 SPK', -2.96, -3.40);
      drawOutline(2.40, -1.95, 0.78, 0.72, 'U4 AMS1117-3.3', 1.80, -2.48);
      drawOutline(2.72, -0.35, 0.64, 2.18, 'J3 8P RELAY', 2.26, 0.90);

      g.fillStyle = 'rgba(244, 249, 246, 0.86)';
      g.font = '700 17px ui-monospace, monospace';
      g.fillText('R21-23:I2S', pcbX(-1.82), pcbY(-1.92));
      g.fillText('R25-27:RLY', pcbX(-1.82), pcbY(-2.74));
      g.fillText('Q1 Q2', pcbX(-1.24), pcbY(-0.52));
      g.fillText('5.1K CC1/CC2', pcbX(-0.76), pcbY(-2.92));
      g.fillText('USB1 TYPE-C', pcbX(-0.56), pcbY(-3.12));
      g.fillText('SW1 BOOT', pcbX(1.96), pcbY(-2.96));
      g.fillText('SW2 RST', pcbX(2.84), pcbY(-2.96));
      g.fillText('PWR  IO', pcbX(-1.14), pcbY(-3.04));

      /* J3 Pinout silkscreen */
      g.font = '700 15px ui-monospace, monospace';
      const j3Lbls = ['5V', 'GND', 'IO40', 'IO2', 'IO1', '3V3', 'RX', 'TX'];
      for (let i = 0; i < 8; i++) {
        g.fillText(j3Lbls[i], pcbX(3.12), pcbY(0.55 - i * 0.255));
      }

      /* 6-pad SWD / UART Test Points along bottom-left */
      const tpNames = ['3V3', 'GND', 'TX', 'RX', 'IO0', 'EN'];
      for (let i = 0; i < tpNames.length; i++) {
        const tx = -2.02 + i * 0.22;
        const px = pcbX(tx), py = pcbY(-3.55);
        g.fillStyle = '#072214';
        g.beginPath(); g.arc(px, py, pcbLen(0.08), 0, Math.PI * 2); g.fill();
        g.fillStyle = '#e0be5c';
        g.beginPath(); g.arc(px, py, pcbLen(0.062), 0, Math.PI * 2); g.fill();
        g.fillStyle = 'rgba(244, 249, 246, 0.80)';
        g.font = '700 15px ui-monospace, monospace';
        g.fillText(tpNames[i], px - 13, py - 18);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 16;
      return tex;

    function makeEspShieldTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const g = c.getContext('2d');

      /* Brushed stainless RF shield can */
      const grad = g.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#cfd6df');
      grad.addColorStop(0.5, '#b2bac6');
      grad.addColorStop(1, '#98a1af');
      g.fillStyle = grad;
      g.fillRect(0, 0, 512, 512);

      g.strokeStyle = 'rgba(255,255,255,0.09)';
      g.lineWidth = 2;
      for (let y = 0; y < 512; y += 5) {
        g.beginPath(); g.moveTo(0, y); g.lineTo(512, y); g.stroke();
      }
      /* Subtle stamped bevel inner rim */
      g.strokeStyle = 'rgba(50, 56, 66, 0.22)';
      g.lineWidth = 6;
      g.strokeRect(18, 18, 476, 476);

      /* Espressif stylized RF wave emblem */
      g.strokeStyle = '#333944';
      g.lineWidth = 7;
      g.beginPath(); g.arc(92, 108, 34, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.arc(92, 108, 18, -Math.PI * 0.75, Math.PI * 0.15); g.stroke();
      g.fillStyle = '#333944';
      g.beginPath(); g.arc(92, 108, 6, 0, Math.PI * 2); g.fill();

      g.font = '700 24px ui-monospace, monospace';
      g.fillText('ESPRESSIF', 148, 100);
      g.font = '600 18px ui-monospace, monospace';
      g.fillText('Wi-Fi · BLE 5.0', 148, 128);

      g.font = '700 36px ui-monospace, monospace';
      g.fillText('ESP32-S3', 56, 212);
      g.font = '700 30px ui-monospace, monospace';
      g.fillText('WROOM-1', 56, 254);

      g.font = '600 20px ui-monospace, monospace';
      g.fillStyle = '#454c58';
      g.fillText('N16R8  240MHz', 56, 304);
      g.fillText('FCC ID: 2AC7Z-ESPS3WROOM1', 56, 336);
      g.font = '700 22px ui-monospace, monospace';
      g.fillText('CE   RoHS', 56, 434);

      /* Accurate 10x10 DataMatrix QR */
      g.fillStyle = '#343a44';
      const qx = 342, qy = 352, qs = 10;
      for (let r = 0; r < 10; r++) {
        for (let col = 0; col < 10; col++) {
          const border = (col === 0 || r === 9) || (r === 0 && (col % 2 === 0)) || (col === 9 && (r % 2 === 1));
          const data = (((r * 11 + col * 5 + r * col) % 3) === 0);
          if (border || data) g.fillRect(qx + col * qs, qy + r * qs, qs - 1, qs - 1);
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 16;
      return tex;
    }

    function makeAntennaTexture() {
      /* Authentic Espressif ESP32-S3-WROOM-1 2.4GHz PCB MIFA (Meandered Inverted-F Antenna) */
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 192;
      const g = c.getContext('2d');
      g.fillStyle = '#12161b';
      g.fillRect(0, 0, 512, 192);
      /* ENIG gold MIFA geometry (feed + ground short + meandered radiating arm) */
      g.strokeStyle = '#dfb958';
      g.fillStyle = '#dfb958';
      g.lineWidth = 18;
      g.lineCap = 'square';
      g.lineJoin = 'miter';
      /* Left GND return stub & feed stub */
      g.fillRect(36, 128, 22, 64);
      g.fillRect(96, 128, 22, 64);
      /* Top horizontal radiating trace + folded meander */
      g.beginPath();
      g.moveTo(47, 134);
      g.lineTo(47, 34);
      g.lineTo(192, 34);
      g.lineTo(192, 128);
      g.lineTo(266, 128);
      g.lineTo(266, 34);
      g.lineTo(348, 34);
      g.lineTo(348, 128);
      g.lineTo(432, 128);
      g.lineTo(432, 42);
      g.lineTo(474, 42);
      g.stroke();
      /* Connect feed stub to top bar */
      g.beginPath(); g.moveTo(107, 134); g.lineTo(107, 34); g.stroke();
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    /* ============================================================

    function roundedRectShape(w, h, r) {
      const s = new THREE.Shape();
      const x = -w / 2, y = -h / 2;
      s.moveTo(x + r, y);
      s.lineTo(x + w - r, y);
      s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + h - r);
      s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      s.lineTo(x + r, y + h);
      s.quadraticCurveTo(x, y + h, x, y + h - r);
      s.lineTo(x, y + r);
      s.quadraticCurveTo(x, y, x + r, y);
      return s;
    }

      const dir = base.pos.clone().sub(base.target).multiplyScalar(distScale);
      return {
        pos: base.target.clone().add(dir),
        target: base.target.clone(),
      };

    function hitLcd(ev) {
      const rect = renderer.domElement.getBoundingClientRect();
      ndc.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObject(lcdMesh, false);
      if (hits.length === 0 || !hits[0].uv) return null;
      const uv = hits[0].uv;
      return [
        Math.max(0, Math.min(479, Math.floor(uv.x * 480))),
        Math.max(0, Math.min(479, Math.floor((1 - uv.y) * 480))),
      ];
    }

      lcdPointerId = ev.pointerId;
      controls.enabled = false;
      renderer.domElement.setPointerCapture(ev.pointerId);
      api.pointerDown(pt[0], pt[1]);

    let audioCtx = null;

    const AUDIO_CHUNK = 1024;
    const IR_MODES = ['studio', 'hall', 'dry'];
    let irModeIdx = 0; /* default: 'studio' (Hardware Cabinet IR + Desk Studio Stereo IR + HRTF) */

    function mulberry32(seed) {
      let a = seed >>> 0;
      return () => {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    /**
     * Synthesize a minimum-phase-like physical IR for the ESP32-4848S040C
     * PCB-mounted NS4168 micro-speaker & acrylic enclosure (512 samples).
     */
    function buildSpeakerIR(ctx) {
      const sr = ctx.sampleRate;
      const len = Math.max(256, Math.round(sr * 0.012));
      const buf = ctx.createBuffer(1, len, sr);
      const data = buf.getChannelData(0);
      const modes = [
        { f: 880,  q: 4.5, g: 0.24 },  /* internal PCB cavity mode */
        { f: 2650, q: 5.2, g: 0.19 },  /* micro-diaphragm presence */
        { f: 5200, q: 3.8, g: 0.11 },  /* rear grille air shimmer */
      ];
      /* Direct impulse + subtle enclosure resonances */
      data[0] = 0.88;
      data[1] = -0.18; /* gentle sub-200Hz acoustic rolloff differentiator */
      for (let i = 1; i < len; i++) {
        const t = i / sr;
        let s = 0;
        for (const m of modes) {
          const tau = m.q / (Math.PI * m.f);
          s += m.g * Math.exp(-t / tau) * Math.sin(2 * Math.PI * m.f * t);
        }
        /* Subtle housing reflection at ~1.1ms */
        const refl = Math.round(sr * 0.0011);
        if (i === refl) s += 0.14;
        data[i] += s;
      }
      /* Normalize RMS energy to unity so dry/wet switching has zero level jump */
      let e = 0;
      for (let i = 0; i < len; i++) e += data[i] * data[i];
      const norm = 1 / Math.max(0.001, Math.sqrt(e));
      for (let i = 0; i < len; i++) data[i] *= norm;
      return buf;
    }

    /**
     * Synthesize a true stereo 3-band frequency-damped Impulse Response (IR)
     * with image-source binaural early reflections (ITD/ILD) + decorrelated late tail.
     */
    function buildRoomIR(ctx, mode) {
      const sr = ctx.sampleRate;
      const isHall = (mode === 'hall');
      const dur = isHall ? 2.25 : 1.05;
      const len = Math.round(sr * dur);
      const buf = ctx.createBuffer(2, len, sr);

      /* Early reflections: [timeMs, gainL, gainR, itdMs] */
      const early = isHall ? [
        [13.5,  0.52,  0.34,  0.42],
        [19.2,  0.32,  0.50, -0.38],
        [27.8,  0.40,  0.38,  0.22],
        [36.4, -0.36,  0.26,  0.55],
        [44.1,  0.24, -0.35, -0.48],
        [53.7,  0.30,  0.28,  0.31],
        [64.2, -0.22, -0.25, -0.25],
        [75.8,  0.21,  0.19,  0.40],
      ] : [
        /* Cutting-mat desk bounce + near-field studio walls */
        [ 1.8,  0.46,  0.46,  0.00], /* cutting mat bounce */
        [ 4.7,  0.44,  0.24,  0.36], /* left wall */
        [ 6.1,  0.22,  0.42, -0.34], /* right wall */
        [ 9.4, -0.30, -0.28,  0.12], /* ceiling */
        [13.8,  0.26, -0.18,  0.44], /* rear monitor / shelf */
        [18.5, -0.17,  0.24, -0.39], /* right corner */
        [24.2,  0.16,  0.15,  0.22], /* back wall */
        [30.9, -0.12, -0.13, -0.18], /* secondary desk-wall */
      ];

      const rtLow  = isHall ? 2.15 : 0.68;
      const rtMid  = isHall ? 1.75 : 0.50;
      const rtHigh = isHall ? 0.78 : 0.21;
      const preDelayS = Math.round(sr * (isHall ? 0.018 : 0.005));

      for (let ch = 0; ch < 2; ch++) {
        const out = buf.getChannelData(ch);
        const rand = mulberry32(ch === 0 ? (isHall ? 0x243F6A88 : 0x1337C0DE) : (isHall ? 0x85A308D3 : 0xBADC0FFE));

        /* 1. Binaural early reflections with soft 2-sample fractional impulse */
        for (const [ms, gL, gR, itd] of early) {
          const tMs = ms + (ch === 1 ? itd : 0);
          const idx = Math.round(sr * Math.max(0.0005, tMs * 0.001));
          const g = (ch === 0 ? gL : gR) * (isHall ? 0.58 : 0.45);
          if (idx >= 0 && idx + 2 < len) {
            out[idx]     += g * 0.72;
            out[idx + 1] += g * 0.28;
          }
        }

        /* 2. 3-band damped late reverberation tail (Low / Mid / High RT60) */
        const kLow  = 6.907755 / (rtLow * sr);
        const kMid  = 6.907755 / (rtMid * sr);
        const kHigh = 6.907755 / (rtHigh * sr);
        /* 1-pole crossover coefficients */
        const aLo = 1 - Math.exp(-2 * Math.PI * 450 / sr);
        const aHi = 1 - Math.exp(-2 * Math.PI * 3200 / sr);
        let lpLo = 0, lpHi = 0;
        const tailGain = isHall ? 0.34 : 0.22;

        for (let i = preDelayS; i < len; i++) {
          const n = i - preDelayS;
          /* Smooth fade-in of diffuse tail over first 18ms */
          const build = Math.min(1, n / (sr * (isHall ? 0.032 : 0.016)));
          /* Gaussian-like white noise via sum of 2 uniforms */
          const w = (rand() + rand() - 1.0);
          lpLo += aLo * (w - lpLo);
          lpHi += aHi * (w - lpHi);
          const bLow  = lpLo;
          const bMid  = lpHi - lpLo;
          const bHigh = w - lpHi;

          const s = bLow * Math.exp(-kLow * n) * 0.85
                  + bMid * Math.exp(-kMid * n) * 1.00
                  + bHigh * Math.exp(-kHigh * n) * 0.65;
          out[i] += s * build * tailGain;
        }
      }

      /* Normalize stereo IR energy smoothly */
      let energy = 0;
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) energy += d[i] * d[i];
      }
      const norm = (isHall ? 1.15 : 0.92) / Math.max(0.01, Math.sqrt(energy * 0.5));
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] *= norm;
      }
      return buf;
    }

    function applyIrMode() {
      const mode = IR_MODES[irModeIdx];
      btnIr.classList.toggle('active', mode !== 'dry');
      btnIr.textContent = mode === 'studio' ? 'IR' : (mode === 'hall' ? 'HALL' : 'DRY');
      if (!audioGraph || !audioCtx) return;
      const t = audioCtx.currentTime;
      const g = audioGraph;
      if (mode === 'dry') {
        g.cabDry.gain.setTargetAtTime(1.0, t, 0.025);
        g.cabWet.gain.setTargetAtTime(0.0, t, 0.025);
        g.directOut.gain.setTargetAtTime(0.0, t, 0.025);
        g.bypassOut.gain.setTargetAtTime(1.0, t, 0.025);
        g.studioSend.gain.setTargetAtTime(0.0, t, 0.025);
        g.hallSend.gain.setTargetAtTime(0.0, t, 0.025);
      } else if (mode === 'studio') {
        g.cabDry.gain.setTargetAtTime(0.58, t, 0.025);
        g.cabWet.gain.setTargetAtTime(0.46, t, 0.025);
        g.directOut.gain.setTargetAtTime(0.95, t, 0.025);
        g.bypassOut.gain.setTargetAtTime(0.0, t, 0.025);
        g.studioSend.gain.setTargetAtTime(0.38, t, 0.025);
        g.hallSend.gain.setTargetAtTime(0.0, t, 0.025);
      } else { /* 'hall' */
        g.cabDry.gain.setTargetAtTime(0.80, t, 0.025);
        g.cabWet.gain.setTargetAtTime(0.24, t, 0.025);
        g.directOut.gain.setTargetAtTime(0.86, t, 0.025);
        g.bypassOut.gain.setTargetAtTime(0.0, t, 0.025);
        g.studioSend.gain.setTargetAtTime(0.0, t, 0.025);
        g.hallSend.gain.setTargetAtTime(0.56, t, 0.025);
      }
    }

    function initAudioGraph(ctx) {
      const input = ctx.createGain();
      input.gain.value = 1.0;

      /* Stage 1: Physical Hardware Speaker/Enclosure IR */
      const cabDry = ctx.createGain();
      const cabWet = ctx.createGain();
      const cabConv = ctx.createConvolver();
      cabConv.normalize = false;
      cabConv.buffer = buildSpeakerIR(ctx);

      const cabSum = ctx.createGain();
      input.connect(cabDry);
      input.connect(cabConv);
      cabConv.connect(cabWet);
      cabDry.connect(cabSum);
      cabWet.connect(cabSum);

      /* Stage 2: Front-Glass vs Rear-PCB Acoustic Diffraction Filter */
      const diffFilter = ctx.createBiquadFilter();
      diffFilter.type = 'lowpass';
      diffFilter.frequency.value = 14000;
      diffFilter.Q.value = 0.65;

      /* Stage 3: Binaural 3D HRTF Panner anchored to the 3D ESP32-S3 PCB Speaker */
      const panner = ctx.createPanner();
      panner.panningModel = 'HRTF';
      panner.distanceModel = 'inverse';
      panner.refDistance = 0.18;
      panner.maxDistance = 4.0;
      panner.rolloffFactor = 0.65;
      panner.coneInnerAngle = 110;
      panner.coneOuterAngle = 250;
      panner.coneOuterGain = 0.68;

      const directOut = ctx.createGain();
      cabSum.connect(diffFilter);
      diffFilter.connect(panner);
      panner.connect(directOut);

      /* Stage 4: Dual Stereo Spatial Room IR Convolvers (Click-free Crossfade) */
      const studioSend = ctx.createGain();
      const studioConv = ctx.createConvolver();
      studioConv.normalize = false;
      studioConv.buffer = buildRoomIR(ctx, 'studio');
      cabSum.connect(studioSend);
      studioSend.connect(studioConv);

      const hallSend = ctx.createGain();
      const hallConv = ctx.createConvolver();
      hallConv.normalize = false;
      hallConv.buffer = buildRoomIR(ctx, 'hall');
      cabSum.connect(hallSend);
      hallSend.connect(hallConv);

      /* Direct DRY bypass path (for instant A/B comparison) */
      const bypassOut = ctx.createGain();
      bypassOut.gain.value = 0.0;
      input.connect(bypassOut);

      /* Master Bus Limiter / Dynamics Protection */
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -10;
      comp.knee.value = 12;
      comp.ratio.value = 4;
      comp.attack.value = 0.003;
      comp.release.value = 0.12;

      directOut.connect(comp);
      studioConv.connect(comp);
      hallConv.connect(comp);
      bypassOut.connect(comp);
      comp.connect(ctx.destination);

      audioGraph = {
        input, cabDry, cabWet, diffFilter, panner, directOut,
        studioSend, hallSend, bypassOut,
      };
      applyIrMode();
    }

    const _spkPos = new THREE.Vector3();
    const _spkFwd = new THREE.Vector3();
    const _camFwd = new THREE.Vector3();
    const _camUp  = new THREE.Vector3();
    const _toCam  = new THREE.Vector3();
    const _devQuat = new THREE.Quaternion();

    function updateSpatialAudio() {
      if (!audioCtx || !audioGraph || audioCtx.state !== 'running') return;
      const t = audioCtx.currentTime;
      const S = 0.01; /* Three.js scene scale: 1 unit = 10mm = 0.01m */

      /* Sync AudioListener to Three.js Camera */
      const L = audioCtx.listener;
      camera.getWorldDirection(_camFwd);
      _camUp.set(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
      if (L.positionX) {
        L.positionX.setValueAtTime(camera.position.x * S, t);
        L.positionY.setValueAtTime(camera.position.y * S, t);
        L.positionZ.setValueAtTime(camera.position.z * S, t);
        L.forwardX.setValueAtTime(_camFwd.x, t);
        L.forwardY.setValueAtTime(_camFwd.y, t);
        L.forwardZ.setValueAtTime(_camFwd.z, t);
        L.upX.setValueAtTime(_camUp.x, t);
        L.upY.setValueAtTime(_camUp.y, t);
        L.upZ.setValueAtTime(_camUp.z, t);
      } else if (L.setPosition) {
        L.setPosition(camera.position.x * S, camera.position.y * S, camera.position.z * S);
        L.setOrientation(_camFwd.x, _camFwd.y, _camFwd.z, _camUp.x, _camUp.y, _camUp.z);
      }

      /* Sync PannerNode to the Rear PCB Speaker Anchor */
      speakerAnchor.getWorldPosition(_spkPos);
      devicePivot.getWorldQuaternion(_devQuat);
      _spkFwd.set(0, 0, -1).applyQuaternion(_devQuat).normalize();
      const P = audioGraph.panner;
      if (P.positionX) {
        P.positionX.setValueAtTime(_spkPos.x * S, t);
        P.positionY.setValueAtTime(_spkPos.y * S, t);
        P.positionZ.setValueAtTime(_spkPos.z * S, t);
        P.orientationX.setValueAtTime(_spkFwd.x, t);
        P.orientationY.setValueAtTime(_spkFwd.y, t);
        P.orientationZ.setValueAtTime(_spkFwd.z, t);
      } else if (P.setPosition) {
        P.setPosition(_spkPos.x * S, _spkPos.y * S, _spkPos.z * S);
        P.setOrientation(_spkFwd.x, _spkFwd.y, _spkFwd.z);
      }

      /* Physical Bezel Diffraction: subtly brighter when viewing open PCB rear, warm diffraction from front glass */
      _toCam.copy(camera.position).sub(_spkPos).normalize();
      const rearFacing = _spkFwd.dot(_toCam); /* -1 = front LCD view, +1 = open rear PCB view */
      const u = Math.max(0, Math.min(1, (rearFacing + 1) * 0.5));
      const cutHz = 9200 + u * 10200;
      audioGraph.diffFilter.frequency.setTargetAtTime(cutHz, t, 0.04);
    }

    function syncSfxButton() {
      if (!api) return;
      const on = api.sfxIsMuted() === 0;
      btnSfx.classList.toggle('active', on);
      btnSfx.textContent = on ? 'SFX' : 'MUTE';
    }

    function pumpAudio() {
      if (!audioCtx || !audioGraph || !api || !mod || audioCtx.state !== 'running') return;
      if (api.sfxIsMuted()) {
        audioNextTime = audioCtx.currentTime;
        return;
      }
      const now = audioCtx.currentTime;
      if (audioNextTime < now) audioNextTime = now + 0.015;
      const horizon = now + 0.085;
      while (audioNextTime < horizon) {
        const ptr = api.audioRender(AUDIO_CHUNK);
        const samples = mod.HEAPF32.subarray(ptr >> 2, (ptr >> 2) + AUDIO_CHUNK);
        let silent = true;
        for (let i = 0; i < AUDIO_CHUNK; i++) {
          if (samples[i] !== 0) { silent = false; break; }
        }
        if (!silent) {
          const buf = audioCtx.createBuffer(1, AUDIO_CHUNK, audioCtx.sampleRate);
          buf.copyToChannel(samples, 0);
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          src.connect(audioGraph.input);
          src.start(audioNextTime);
        }
        audioNextTime += AUDIO_CHUNK / audioCtx.sampleRate;
      }
    }

    function ensureAudioUnlocked() {
      if (!api) return;
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
        api.audioSetRate(audioCtx.sampleRate);
        initAudioGraph(audioCtx);
        updateSpatialAudio();
        audioNextTime = audioCtx.currentTime;
        audioTimer = setInterval(pumpAudio, 15);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    window.addEventListener('pointerdown', ensureAudioUnlocked, { capture: true, passive: true });
    window.addEventListener('keydown', ensureAudioUnlocked, { capture: true, passive: true });

    btnSfx.addEventListener('click', () => {
      if (!api) return;
      ensureAudioUnlocked();
      const nextMute = api.sfxIsMuted() ? 0 : 1;
      api.sfxSetMuted(nextMute);
      if (!nextMute) api.sfxPlay(1); /* SFX_CONFIRM */
      syncSfxButton();
    });

    btnIr.addEventListener('click', () => {
      if (!api) return;
      ensureAudioUnlocked();
      irModeIdx = (irModeIdx + 1) % IR_MODES.length;
      applyIrMode();
      if (!api.sfxIsMuted()) api.sfxPlay(10); /* SFX_CRYSTAL audition chime */
    });

    /* ============================================================
     * 9. Boot WASM Core, Welcome PCB->3D Reveal & Main 60Hz Loop
     * ============================================================ */
    const urlParams = new URLSearchParams(location.search);
    const startView = urlParams.get('view');
    const skipIntro = Boolean(startView && BASE_VIEWS[startView]) || urlParams.get('intro') === '0';
    let welcomeIntro = null;

    if (startView && BASE_VIEWS[startView]) {
      setView(startView, true);
    }

    function startWelcomeIntro() {
      const targetView = getResponsiveView('iso');
      const tgt = targetView.target.clone();
      const endVec = targetView.pos.clone().sub(tgt);
      const endRadius = endVec.length();
      const endAz = Math.atan2(endVec.x, endVec.z); /* ~ +0.35 rad (front-right 3D hero) */
      const endElev = Math.asin(Math.max(-0.9, Math.min(0.9, endVec.y / endRadius)));

      /* Start directly behind the PCB, slightly zoomed in to showcase the accurate copper & WROOM-1 */
      const startAz = endAz - Math.PI * 1.06; /* ~ -171 deg (rear PCB spotlight) */
      const holdAz  = endAz - Math.PI * 0.96; /* gentle 18-deg parallax glide across the PCB */
      const startRadius = endRadius * 0.72;
      const holdRadius  = endRadius * 0.80;

      document.body.classList.add('intro-playing');
      controls.enabled = false;
      lcdGlowLight.intensity = 0.2;

      welcomeIntro = {
        t0: performance.now(),
        holdDur: 1100, /* 1.1s: emerge from darkness onto the illuminated rear PCB */
        spinDur: 1450, /* 1.45s: sleek ~175° orbital flip to the interactive 3D viewport */
        tgt, startAz, holdAz, endAz, startRadius, holdRadius, endRadius,
        startElev: 0.13, endElev,
      };
      /* Place camera at initial PCB angle immediately before veil fades */
      const r0 = startRadius;
      camera.position.set(
        tgt.x + r0 * Math.cos(0.13) * Math.sin(startAz),
        tgt.y + r0 * Math.sin(0.13),
        tgt.z + r0 * Math.cos(0.13) * Math.cos(startAz)
      );
      controls.target.copy(tgt);
      camera.lookAt(tgt);
    }

    function finishWelcomeIntro() {
      if (!welcomeIntro) return;
      welcomeIntro = null;
      document.body.classList.remove('intro-playing');
      controls.enabled = true;
      lcdGlowLight.intensity = 2.4;
      setView('iso', true);
    }

    function stepWelcomeIntro(now) {
      if (!welcomeIntro) return;
      const w = welcomeIntro;
      const el = now - w.t0;
      let az, rad, elev;
      if (el < w.holdDur) {
        /* Phase 1: Slow cinematic glide across the illuminated rear PCB */
        const u = Math.max(0, Math.min(1, el / w.holdDur));
        const ease = 1 - Math.pow(1 - u, 2.2);
        az = w.startAz + (w.holdAz - w.startAz) * ease;
        rad = w.startRadius + (w.holdRadius - w.startRadius) * ease;
        elev = w.startElev;
        lcdGlowLight.intensity = 0.25;
      } else {
        /* Phase 2: Smooth 180-deg orbital spin around the frame into the front 3D hero view */
        const u = Math.max(0, Math.min(1, (el - w.holdDur) / w.spinDur));
        /* Quintic ease-in-out for weighty physical turntable momentum */
        const ease = u < 0.5
          ? 16 * u * u * u * u * u
          : 1 - Math.pow(-2 * u + 2, 5) / 2;
        az = w.holdAz + (w.endAz - w.holdAz) * ease;
        /* Slight graceful pull-out arc at the 90-deg side profile */
        const arcBoost = Math.sin(u * Math.PI) * 1.6;
        rad = w.holdRadius + (w.endRadius - w.holdRadius) * ease + arcBoost;
        elev = w.startElev + (w.endElev - w.startElev) * ease;
        /* Bloom LCD glow smoothly as the screen swings into view */
        const glowU = Math.max(0, Math.min(1, (u - 0.35) / 0.55));
        lcdGlowLight.intensity = 0.25 + 2.15 * glowU;
        if (u >= 1) {
          finishWelcomeIntro();
          return;
        }
      }
      camera.position.set(
        w.tgt.x + rad * Math.cos(elev) * Math.sin(az),
        w.tgt.y + rad * Math.sin(elev),
        w.tgt.z + rad * Math.cos(elev) * Math.cos(az)
      );
      controls.target.copy(w.tgt);
      camera.lookAt(w.tgt);
    }

    const imgData = lcdCtx.createImageData(480, 480);
    let mod = null;

    function updateGlowColor(bytes) {
      let r = 0, g = 0, b = 0, n = 0;
      for (let y = 80; y < 400; y += 32) {
        for (let x = 40; x < 440; x += 40) {
          const idx = (y * 480 + x) * 4;
          r += bytes[idx];
          g += bytes[idx + 1];
          b += bytes[idx + 2];
          n++;
        }
      }
      if (n > 0) {
        lcdGlowLight.color.setRGB(
          Math.min(1, (r / n) / 200),
          Math.min(1, (g / n) / 200),
          Math.min(1, (b / n) / 200)
        );
      }
    }

    function blitLcd(sampleGlow) {
      if (!api || !mod) return;
      const ptr = api.getRgbaPtr();
      const bytes = mod.HEAPU8.subarray(ptr, ptr + 480 * 480 * 4);
      imgData.data.set(bytes);
      lcdCtx.putImageData(imgData, 0, 0);
      lcdTexture.needsUpdate = true;
      if (sampleGlow) updateGlowColor(bytes);
    }

    createCrystalGarden().then((Module) => {
      mod = Module;
      api = {
        init: Module.cwrap('emu_init', null, []),
        step: Module.cwrap('emu_step', null, ['number']),
        render: Module.cwrap('emu_render', null, []),
        getRgbaPtr: Module.cwrap('emu_get_rgba_ptr', 'number', []),
        pointerDown: Module.cwrap('emu_pointer_down', null, ['number', 'number']),
        pointerMove: Module.cwrap('emu_pointer_move', null, ['number', 'number']),
        pointerUp: Module.cwrap('emu_pointer_up', null, ['number', 'number']),
        sendCommand: Module.cwrap('emu_send_command', null, ['string']),
        save: Module.cwrap('emu_save', null, []),
        audioSetRate: Module.cwrap('emu_audio_set_rate', null, ['number']),
        audioRender: Module.cwrap('emu_audio_render', 'number', ['number']),
        sfxSetMuted: Module.cwrap('emu_sfx_set_muted', null, ['number']),
        sfxIsMuted: Module.cwrap('emu_sfx_is_muted', 'number', []),
        sfxPlay: Module.cwrap('emu_sfx_play', null, ['number']),
      };

      api.init();
      syncSfxButton();
      const initCmd = urlParams.get('cmd');
      if (initCmd) {
        initCmd.split(';').forEach((c) => { if (c.trim()) api.sendCommand(c.trim()); });
        api.step(1 / 60);
        api.render();
      }
      const skipFrames = Math.min(600, Math.max(0, Number(urlParams.get('f') || 0) | 0));
      for (let i = 0; i < skipFrames; i++) api.step(1 / 60);
      if (skipFrames > 0) api.render();
      blitLcd(true);

      const veil = document.getElementById('veil');
      const pulseEl = veil.querySelector('.pulse');
      if (pulseEl) pulseEl.style.display = 'none';
      if (!skipIntro) {
        startWelcomeIntro();
        requestAnimationFrame(() => {
          veil.classList.add('gone');
          setTimeout(() => veil.remove(), 950);
        });
      } else {
        veil.classList.add('gone');
        setTimeout(() => veil.remove(), 400);
      }

      window.addEventListener('pagehide', () => api.save());

      const STEP_MS = 1000 / 60;
      let lastT = performance.now();
      let accum = 0;
      let frameIdx = 0;

      function animate(now) {
        requestAnimationFrame(animate);

        const dtMs = Math.min(100, now - lastT);
        lastT = now;

        accum += dtMs * speedMult;
        let steps = 0;
        const maxSteps = speedMult >= 2 ? 4 : 2;
        while (accum >= STEP_MS && steps < maxSteps) {
          api.step(1 / 60);
          accum -= STEP_MS;
          steps++;
        }
        if (steps > 0) {
          api.render();
          blitLcd((frameIdx++ % 10) === 0);
          if ((frameIdx % 15) === 0) syncSfxButton();
        }

        // Subtle status LED heartbeat on PCB
        const pulse = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(now * 0.006));
        actLedMat.color.setRGB(0.18 * pulse, 0.85 * pulse, 1.0 * pulse);

        // Welcome PCB -> 3D orbital reveal or preset camera transition
        if (welcomeIntro) {
          stepWelcomeIntro(now);
        } else if (camAnim) {
          const u = Math.min(1, (now - camAnim.t0) / camAnim.dur);
          const ease = 1 - Math.pow(1 - u, 3);
          camera.position.lerpVectors(camAnim.p0, camAnim.p1, ease);
          controls.target.lerpVectors(camAnim.tStart, camAnim.tEnd, ease);
          if (u >= 1) camAnim = null;
        }

        if (!welcomeIntro) controls.update();
        updateSpatialAudio();
        renderer.render(scene, camera);
      }

      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
