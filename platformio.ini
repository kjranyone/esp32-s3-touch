; ============================================================
; ESP32-S3 4.0" 480x480 Smart Screen
; 確定モデル: Shenzhen Jingcai Intelligent ESP32-4848S040C_I_Y_3
;   - LCD   : ST7701 (3-wire SPI init + RGB565 16bit) 480x480
;   - Touch : GT911 (I2C, SCL=45 / SDA=19)
;   - Backlight : GPIO38 (PWM)
;   - SoC   : ESP32-S3R8 (8MB octal PSRAM) / 16MB quad Flash
; 詳細は docs/DEVICE_SPEC.md を参照
; ============================================================
[platformio]
default_envs = BOARD_JINGCAI_ESP32_4848S040C_I_Y_3

; 共通設定
[env]
; 公式 espressif32 は arduino-esp32 3.1.x 非対応のため、Espressif 公式例と同じ
; pioarduino プラットフォームを使用 (S3 の RGB LCD 画面揺れ対策済み高速 libs を含む)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
framework = arduino
board = esp32-s3-devkitc-1

; --- ポート設定 (実測に基づく: CH340 @ COM5) ---
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
; 921600 baud では CH340 がデータ破損するため 460800 を採用
upload_speed = 460800

; --- メモリ構成 (実測 + Espressif 推奨設定) ---
board_build.arduino.memory_type = qio_opi  ; ESP32-S3R8 (octal PSRAM) 向け SDK バリアント
board_build.flash_mode = qio          ; Espressif 推奨 (QIO 80MHz)。純正 FW は DIO だったが eFuse は quad
board_build.flash_size = 16MB
board_build.psram_type = opi          ; 内蔵 8MB octal PSRAM (ESP32-S3R8)
board_build.partitions = default_16MB.csv

lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -I src
    ; ボード選択 (ESP32_Display_Panel 内蔵の JingCai ESP32-4848S040C_I_Y_3 定義)
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_JINGCAI_ESP32_4848S040C_I_Y_3

monitor_filters = esp32_exception_decoder

; ============================================================
; ビルド環境 (ESP32_Display_Panel 内蔵の JingCai ボード定義を使用)
; ============================================================
[env:BOARD_JINGCAI_ESP32_4848S040C_I_Y_3]
; [env] の共通設定をそのまま継承

